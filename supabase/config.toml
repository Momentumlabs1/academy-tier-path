# Webhooks are called by external services (broker / Telegram), not by a
# logged-in Supabase user — so they must NOT require a Supabase JWT.
# They authenticate themselves via their own shared secret / HMAC.
[functions.broker-webhook]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

# Called from the public website (the "Connect Telegram" button); it verifies
# the member itself, so no Supabase user JWT is required.
[functions.create-telegram-link]
verify_jwt = false

# Admin settings API — guarded by its own ADMIN_KEY header, not a Supabase JWT.
[functions.admin-tenants]
verify_jwt = false

# Partner admin access. `accept`/`login` are called by a partner who has no
# session yet, so this can't sit behind a Supabase JWT — the function does its
# own admin check for the sensitive `invite` action.
[functions.partner-admin]
verify_jwt = false
