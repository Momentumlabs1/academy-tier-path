<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070a10}canvas{position:absolute;left:0;top:0}</style>
</head><body><canvas id="cv" width="1920" height="1080"></canvas><script>
const X=document.getElementById('cv').getContext('2d');const W=1920,H=1080;
const BG='#070a10',INK='#eaf2f8',MUT='#8b98a8',DIM='#5a6a80',LIME='#b6f04a',CYAN='#39d0d0',MAG='#e06bd8',RED='#ff5470',GRN='#33e08a',GOLD='#ffcf5c';
const SANS='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',MONO='ui-monospace,"SF Mono",Menlo,monospace';
const P=Math.round;let T=0;
const clamp=(u,a,b)=>u<a?a:u>b?b:u;
const es=u=>{u=clamp(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const eo=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3);};
const bo=u=>{u=clamp(u,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
const rr=(x,y,w,h,r)=>{x=P(x);y=P(y);w=P(w);h=P(h);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();};
const rnd=s=>{s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s);};
const sA=(t0,t1)=>{const i=clamp((T-t0)/0.4,0,1),o=clamp((t1-T)/0.4,0,1);return Math.max(0,Math.min(i,o));};
const rv=(t0,d)=>es(clamp((T-t0)/(d||0.5),0,1));
const ry=(t0,d)=>{const u=clamp((T-t0)/(d||0.55),0,1);return (1-bo(u))*22;};
function pbox(x,y,w,h,col,a){X.fillStyle='rgba(12,18,26,0.5)';rr(x,y,w,h,18);X.fill();X.strokeStyle=hexA(col,a==null?0.5:a);X.lineWidth=2;rr(x,y,w,h,18);X.stroke();}
function kick(txt,x,y,col){X.save();X.fillStyle=col;X.font='800 26px '+MONO;X.textAlign='left';X.textBaseline='alphabetic';X.fillText('● '+txt,P(x),P(y));X.restore();}
function chkIcon(cx,cy,good,col,r){r=r||16;X.save();X.translate(P(cx),P(cy));X.fillStyle=col;X.beginPath();X.arc(0,0,r,0,7);X.fill();X.strokeStyle='#0a0e10';X.lineWidth=3.5;X.lineCap='round';X.lineJoin='round';
  if(good){X.beginPath();X.moveTo(-r*0.42,0);X.lineTo(-r*0.1,r*0.38);X.lineTo(r*0.5,-r*0.44);X.stroke();}else{X.beginPath();X.moveTo(-r*0.4,-r*0.4);X.lineTo(r*0.4,r*0.4);X.moveTo(r*0.4,-r*0.4);X.lineTo(-r*0.4,r*0.4);X.stroke();}X.restore();}
function bg(){X.fillStyle=BG;X.fillRect(0,0,W,H);
  X.save();X.globalAlpha=0.045;X.strokeStyle='#5a6a80';X.lineWidth=1;const ox=P((T*8)%80);
  for(let x=-80+ox;x<W;x+=80){X.beginPath();X.moveTo(P(x)+0.5,0);X.lineTo(P(x)+0.5,H);X.stroke();}
  for(let y=0;y<H;y+=80){X.beginPath();X.moveTo(0,y+0.5);X.lineTo(W,y+0.5);X.stroke();}X.restore();
  [[360,300,RED],[1560,760,MAG],[1180,220,GOLD]].forEach((o,i)=>{const ph=T*0.2+i*2.1;const gx=o[0]+Math.sin(ph)*50,gy=o[1]+Math.cos(ph*0.8)*38;
    const g=X.createRadialGradient(gx,gy,0,gx,gy,540);g.addColorStop(0,hexA(o[2],0.07));g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(gx-540,gy-540,1080,1080);});}
function vignette(){const g=X.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.9);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.5)');X.fillStyle=g;X.fillRect(0,0,W,H);}
function cap(txt,col,t0,t1){const a=sA(t0,t1);if(a<=0)return;X.save();X.globalAlpha=a;X.textAlign='center';X.textBaseline='middle';
  const y=H-112;X.font='800 38px '+SANS;const w=X.measureText(txt).width+76;X.fillStyle='#0c1420';rr(W/2-w/2,y-38,w,76,16);X.fill();
  X.strokeStyle=hexA(col,0.7);X.lineWidth=2;rr(W/2-w/2,y-38,w,76,16);X.stroke();X.fillStyle=INK;X.fillText(txt,P(W/2),P(y));X.restore();}
function wrapText(txt,x,y,maxw,lh){const ws=txt.split(' ');let line='',yy=y;const lines=[];
  for(const w of ws){const t=line?line+' '+w:w;if(X.measureText(t).width>maxw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);
  const sy=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>X.fillText(l,P(x),P(sy+i*lh)));}
function wrapC(txt,cx,y,maxw,lh){X.textAlign='center';const ws=txt.split(' ');let line='';const lines=[];
  for(const w of ws){const t=line?line+' '+w:w;if(X.measureText(t).width>maxw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);
  const sy=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>X.fillText(l,P(cx),P(sy+i*lh)));}
function wrapL(txt,x,y,maxw,lh){X.textAlign='left';const ws=txt.split(' ');let line='';const lines=[];
  for(const w of ws){const t=line?line+' '+w:w;if(X.measureText(t).width>maxw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);
  lines.forEach((l,i)=>X.fillText(l,P(x),P(y+i*lh)));}

// ---------- candle chart helper (code-drawn) ----------
function drawCandles(bx,by,bw,bh,n,seed,trend){
  const cw=bw/n;let cy=by+bh*(trend>0?0.28:0.60);
  for(let i=0;i<n;i++){
    const cx=P(bx+cw*(i+0.5));
    const step=(rnd(seed+i)-0.5)*bh*0.11 + trend*bh*0.020;
    const oY=cy;cy=clamp(cy+step,by+22,by+bh-22);const cY=cy;
    const up=cY<oY;const bt=Math.min(oY,cY),bb=Math.max(oY,cY);
    const wHi=clamp(bt-(5+rnd(seed+i+7)*20),by+3,by+bh-3),wLo=clamp(bb+(5+rnd(seed+i+2)*20),by+3,by+bh-3);
    const col=up?GRN:RED;
    X.strokeStyle=hexA(col,0.75);X.lineWidth=2;X.beginPath();X.moveTo(cx+0.5,P(wHi));X.lineTo(cx+0.5,P(wLo));X.stroke();
    X.fillStyle=hexA(col,0.85);const w2=cw*0.5;rr(cx-w2/2,bt,w2,Math.max(3,bb-bt),2);X.fill();
  }
}
function hLine(bx,bw,y,col,label,val,al){X.save();X.globalAlpha*=(al==null?1:al);
  X.setLineDash([12,10]);X.strokeStyle=hexA(col,0.85);X.lineWidth=2.5;X.beginPath();X.moveTo(P(bx),P(y)+0.5);X.lineTo(P(bx+bw),P(y)+0.5);X.stroke();X.setLineDash([]);
  X.font='800 24px '+MONO;X.textAlign='left';X.textBaseline='middle';const tw=X.measureText(label+'  '+val).width+28;
  X.fillStyle='#0c1420';rr(bx+16,y-20,tw,40,9);X.fill();X.strokeStyle=hexA(col,0.7);X.lineWidth=1.5;rr(bx+16,y-20,tw,40,9);X.stroke();
  X.fillStyle=col;X.fillText(label,P(bx+30),P(y));X.fillStyle=INK;X.fillText('  '+val,P(bx+30+X.measureText(label).width),P(y));X.restore();}

// ---------- SCENE 1: TITLE 0 - 16.8 ----------
function scTitle(){const a=sA(0,16.8);if(a<=0)return;X.save();X.globalAlpha=a;X.textAlign='center';X.textBaseline='middle';
  const kk=rv(0.5,0.5);if(kk>0){X.save();X.globalAlpha*=Math.min(1,kk*1.2);X.fillStyle=CYAN;X.font='800 30px '+MONO;X.fillText('● THE SIGNALS CHANNEL',P(W/2),P(H/2-200+(1-kk)*20));X.restore();}
  X.font='900 132px '+SANS;const lines=[['COPY SIGNALS',INK,1.0],['LIKE A PRO',GOLD,1.35]];
  lines.forEach((l,i)=>{const lu=rv(l[2],0.7);if(lu<=0)return;X.save();X.globalAlpha*=Math.min(1,lu*1.2);X.fillStyle=l[1];if(i===1){X.shadowColor=hexA(GOLD,0.45);X.shadowBlur=26;}X.fillText(l[0],P(W/2),P(H/2-52+i*130+(1-bo(lu))*40));X.restore();});
  const su=rv(4.1,0.6);if(su>0){X.save();X.globalAlpha*=Math.min(1,su);X.fillStyle=MUT;X.font='600 34px '+SANS;X.fillText('In 3 minutes: read it  ·  place it  ·  manage it — the exact workflow',P(W/2),P(H/2+160));X.restore();}
  const gp=rv(13.7,0.5);if(gp>0){X.save();X.globalAlpha*=Math.min(1,gp*1.2);X.fillStyle=LIME;X.font='800 30px '+SANS;X.fillText('Grab your phone — let’s do this together',P(W/2),P(H/2+232));X.restore();}
  X.restore();}

  function row(label,val,y,col,t0){const u=rv(t0,0.5);if(u<=0)return;X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(t0));

    X.fillStyle=GRN;X.font='700 24px '+MONO;X.textAlign='left';X.textBaseline='middle';X.fillText('TAKE PROFIT ×4',P(lx),P(540));X.restore();})();

    X.fillStyle=hexA(GRN,0.5);X.font='700 26px '+MONO;X.textAlign='left';X.textBaseline='middle';X.fillText(tp[0],P(lx),P(tp[2]));
    X.fillStyle=GRN;X.font='800 30px '+MONO;X.textAlign='right';X.fillText(tp[1],P(vx),P(tp[2]));X.restore();});
  // right annotations
  function ann(y,head,body,col,t0){const u=rv(t0,0.5);if(u<=0)return;X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(t0));
    chkIcon(920,y,true,col,12);X.fillStyle=col;X.font='800 30px '+SANS;X.textAlign='left';X.textBaseline='middle';X.fillText(head,P(956),P(y));
    X.fillStyle=MUT;X.font='600 25px '+SANS;X.textBaseline='top';wrapL(body,956,y+22,880,32);X.restore();}
  ann(330,'Direction + instrument','A SELL on GOLD — what and which way.',CYAN,22.22);
  ann(430,'Entry price','Where the trade is meant to start.',INK,27.08);
  ann(505,'Stop loss = your protection','The level where the trade is simply wrong.',RED,30.44);
  ann(628,'Four take-profit levels','Lock in profits, step by step.',GRN,36.1);
  // golden rule banner
  (function(){const u=rv(41.68,0.6);if(u<=0)return;X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(41.68));
    pbox(180,842,1560,110,GOLD,0.75);X.fillStyle=GOLD;X.font='800 24px '+MONO;X.textAlign='left';X.textBaseline='middle';X.fillText('★ GOLDEN RULE',P(220),P(897));
    X.fillStyle=INK;X.font='900 44px '+SANS;X.textAlign='center';X.fillText('1–3% risk per trade  ·  MAXIMUM  ·  no exceptions',P(W/2+70),P(897));X.restore();})();
  X.restore();}

      X.fillStyle='#0c1420';X.font='800 22px '+MONO;const tw=X.measureText('PRICE NOW').width+24;rr(px-tw-16,py-18,tw,36,8);X.fill();X.strokeStyle=hexA(GOLD,0.7);X.lineWidth=1.5;rr(px-tw-16,py-18,tw,36,8);X.stroke();X.fillStyle=GOLD;X.textAlign='center';X.textBaseline='middle';X.fillText('PRICE NOW',P(px-tw/2-16),P(py));}
    X.restore();})();
  // decision banner

    pbox(180,760,1600,150,GOLD,0.7);chkIcon(250,835,false,RED,20);
