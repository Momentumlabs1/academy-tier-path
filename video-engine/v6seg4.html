// ---- S4 gaps ----
const GAPS=[
  {at:13.95,dur:3.5},  // absorption demo: 101 sells → 2 buys → bullish close
  {at:34.90,dur:3.5},  // "Absorption." hold
  {at:39.75,dur:1.2},  // buys in — up (1)
  {at:43.95,dur:1.2},  // buys in — up (2)
  {at:49.00,dur:3.0},  // top forming
  {at:63.00,dur:2.0},  // footprint panel slides in
  {at:80.80,dur:2.0},  // trapped buyers — nothing happens
  {at:99.30,dur:2.5},  // 105 sells hit + break
  {at:109.70,dur:2.0}, // short placed
  {at:116.40,dur:9.0}, // trade runs

const tm=TVC.mkTimeMap(GAPS);
const sT=vo=>tm.sceneT(vo);
const gS=at=>{let s=at;for(const g of GAPS)if(g.at<at)s+=g.dur;return s;};
const S4END=sT(VOW_S4.dur)+0.6;

const OFF5=S4END+0.8;
const GAPS5=[{at:15.10,dur:1.5},{at:21.90,dur:3.0}];

const gS5=at=>{let s=at;for(const g of GAPS5)if(g.at<at)s+=g.dur;return s;};
const DUR=Math.ceil((sT5(VOW_S5.dur)+1.6)*10)/10;   // ≈ 185

// ---- price/story series ----
const PMIN=29610,PMAX=29900;
const NARR=[[0,29706],[8,29698],[14,29690],[16,29702],[22,29745],[30,29796],[34,29816],[42,29818],[48,29806],[56,29799],[60,29797],[62,29788],[63,29785],[70,29768],[78,29753],[86,29758],[100,29764],[119,29770]];
const N=120, SER=TVC.mkSeries(N,NARR,66120,4.2);
// story candles
SER[14].o=29694;SER[14].l=29684;SER[14].c=29699;SER[14].h=29701;      // absorption candle (starts red, closes green)
for(let i=34;i<=42;i++){SER[i].h=Math.min(SER[i].h,29822);if(i%2)SER[i].c=Math.min(SER[i].c,29814);} // ceiling
SER[60].o=29799;SER[60].h=29801;SER[60].l=29790;SER[60].c=29792;      // 105-sell candle
SER[62].o=29791;SER[62].c=29784;SER[62].l=29782;                      // break candle
for(let i=64;i<=78;i++){const u=(i-64)/14;SER[i].o=29785-u*30;SER[i].c=29783-u*31;SER[i].h=SER[i].o+3;SER[i].l=SER[i].c-3;}
const CH={x0:DC.rail.w+16,x1:1180,y0:DC.top.h+52,y1:TASK.y0-DC.bottom.h-40}; // left panel (phase2+); full width in phase1
const CHF={x0:DC.rail.w+16,x1:1846,y0:DC.top.h+52,y1:TASK.y0-DC.bottom.h-40};
const cw=i=>((ch().x1-ch().x0-60)/86);
function ch(){return fpEnv(T)>0.02?CH:CHF;}
const xOf=i=>ch().x0+30+i*cw()+cw()/2;
// dynamic price window — the trader "scrolls" with the market
function pWin(t){
  const k=[[0,29652,29742],[gS(36.3),29652,29742],[gS(47.9)-2,29668,29800],[gS(49.0)+2.5,29690,29852],[gS(63.0),29692,29856],[sT(93.5),29688,29866],[DUR,29688,29866]];
  for(let i=0;i<k.length-1;i++)if(t>=k[i][0]&&t<=k[i+1][0]){
    const u=es(clamp((t-k[i][0])/Math.max(0.001,k[i+1][0]-k[i][0]),0,1));
    return [k[i][1]+(k[i+1][1]-k[i][1])*u, k[i][2]+(k[i+1][2]-k[i][2])*u];
  }
  return [29688,29866];
}
let PW=[29652,29742];
const yOf=p=>ch().y1-(p-PW[0])/(PW[1]-PW[0])*(ch().y1-ch().y0);

// footprint panel env (slides in at 63)
const fpEnv=t=>Math.min(clamp((t-gS(63.0))/0.8,0,1),1);

// ---- reveal ----
function revealAt(t){
  const k=[[0,15],[gS(13.95)+1.2,15],[gS(13.95)+3.4,16],[gS(36.3),16],[gS(47.9),31],[gS(49.0),31],[gS(49.0)+2.8,43],[sT(56.0),44],[sT(93.0),48],[sT(93.6),48],[gS(99.3),61],[gS(99.3)+2.2,63],[gS(109.7),63],[gS(109.7)+0.9,64],[gS(116.4),64],[gS(116.4)+8.6,79],[DUR,80]];
  for(let i=0;i<k.length-1;i++)if(t>=k[i][0]&&t<=k[i+1][0]){
    const u=(t-k[i][0])/Math.max(0.001,k[i+1][0]-k[i][0]);
    return k[i][1]+(k[i+1][1]-k[i][1])*u;
  }
  return 80;
}
// absorption candle morph: red → green during demo
function candleFix(i,t){
  if(i!==14)return SER[i];
  const u=clamp((t-(gS(13.95)+2.0))/1.2,0,1);
  return {o:SER[14].o,h:SER[14].h,l:SER[14].l,c:29688+ (29699-29688)*es(u),v:SER[14].v};
}

// ---- bubbles (deterministic story events) ----
// {i, p, v, buy, big, t0(scene sec)}
const BUB=[];
(function(){
  const add=(i,p,v,buy,big,t0)=>BUB.push({i,p,v,buy,big,t0:t0==null?-1:t0});

    if(r()>0.45)add(i,(SER[i].o+SER[i].c)/2+ (r()*8-4),P(40+r()*90),r()>0.5,false);}
  // absorption demo
  add(14,29686,101,false,true,gS(13.95)+0.3);
  add(14,29688,2,true,false,gS(13.95)+1.6);
  // "absorbed by passive orders" small sells absorbed 19–23
  add(15,29697,64,false,false,sT(19.3));
  // health: buys in — up
  add(17,29708,142,true,true,gS(36.3)+0.9);
  add(19,29722,118,true,true,gS(39.75)+0.2);
  add(24,29752,163,true,true,gS(43.95)+0.2);
  add(27,29774,127,true,false,sT(45.2));
  // sellers step back in
  add(30,29797,205,false,true,sT(45.9));
  // top forming: buys absorbed at ceiling
  add(35,29818,224,true,true,gS(49.0)+0.5);
  add(37,29820,187,true,true,gS(49.0)+1.4);
  add(39,29819,246,true,true,gS(49.0)+2.2);
  add(41,29821,161,true,false,sT(52.4));
  // the trade: 105 sells
  add(60,29793,105,false,true,gS(99.3)+0.4);
  add(62,29786,88,false,true,gS(99.3)+1.7);
  // post-entry flow
  for(let i=65;i<=77;i+=3)add(i,SER[i].c-2,P(50+((i*37)%110)),false,false,gS(116.4)+(i-65)*0.5);
})();

// ---- heatmap bands (passive book) 24.4–34.5 ----
function heatmap(t){
  const a=Math.min(clamp((t-sT(24.4))/0.8,0,1),1-clamp((t-sT(33.0))/1.2,0,1));
  if(a<=0)return;
  X.save();X.globalAlpha=a*0.55;
  const rows=[[29686,0.95],[29694,0.5],[29702,0.35],[29676,0.6],[29668,0.3],[29712,0.25],[29722,0.2]];
  for(const [p,s] of rows){
    const y=yOf(p);
    const g=X.createLinearGradient(ch().x0,0,ch().x1,0);
    g.addColorStop(0,hexA(s>0.7?'#ffd54f':'#4fc3f7',0.02));
    g.addColorStop(0.75,hexA(s>0.7?'#ffb300':'#29b6f6',0.16*s+0.08));
    g.addColorStop(1,hexA(s>0.7?'#ff8f00':'#0288d1',0.30*s+0.1));
    X.fillStyle=g;X.fillRect(ch().x0,y-7,ch().x1-ch().x0,14);
  }
  X.restore();
  // label chip

  X.fillStyle='#ffd54f';X.font='600 13px '+SANS;X.textAlign='left';X.textBaseline='middle';
  X.fillText('Heatmap: passive Orders',ch().x1-318,yOf(29686)-3);
  X.restore();
}

  X.fillStyle='#131722';X.fillText('C:',px0+348,DC.top.h+18);X.fillStyle=C.dcDn;X.fillText('29.809,00',px0+364,DC.top.h+18);

// ---- S5 why-absorption overlay ----
function s5Overlay(t){
  if(t<OFF5-0.2)return;
  const a=clamp((t-OFF5+0.2)/0.6,0,1);
  // dim chart slightly
  X.save();X.globalAlpha=a*0.25;X.fillStyle='#0b0e14';X.fillRect(ch().x0,ch().y0,ch().x1-ch().x0,ch().y1-ch().y0);X.restore();
  // 500 shorts cluster at the ceiling zone
  const cx=xOf(38), cy=yOf(29820);
  const clA=clamp((t-sT5(4.55))/0.6,0,1);
  if(clA>0){
    X.save();X.globalAlpha=clA;
    for(let k=0;k<9;k++){
      const r=IFE.mulberry32(IFE.hashSeed(555,k));
      TVC.dcBubble(X,cx-90+ (k%3)*90+ (r()*22-11), cy-26+Math.floor(k/3)*30+(r()*10-5), [214,202,290,168,143,120,96,84,77][k], false, k<3);
    }
    X.fillStyle='rgba(233,30,140,0.96)';rr(X,cx-108,cy-78,216,30,6);X.fill();
    X.fillStyle='#fff';X.font='800 15px '+SANS;X.textAlign='center';X.textBaseline='middle';
    X.fillText('≈ 500 SHORT-KONTRAKTE',cx,cy-63);
    X.restore();
  }
  // "closing a short = active buy" arrows (9.1–15)
  const arrN=Math.floor(clamp((t-sT5(9.3))/(sT5(14.9)-sT5(9.3)),0,1)*5);
  for(let k=0;k<arrN;k++){
    const ax=cx-80+k*40, ay=cy+18;
    X.save();X.strokeStyle=GRN;X.lineWidth=3.5;X.lineCap='round';
    X.beginPath();X.moveTo(ax,ay+46);X.lineTo(ax,ay);X.moveTo(ax-8,ay+12);X.lineTo(ax,ay);X.lineTo(ax+8,ay+12);X.stroke();X.restore();
  }
  if(arrN>0){
    X.save();X.globalAlpha=clamp((t-sT5(13.1))/0.5,0,1);
    X.fillStyle='rgba(8,153,129,0.96)';rr(X,cx-150,cy+74,300,30,6);X.fill();
    X.fillStyle='#fff';X.font='800 14px '+SANS;X.textAlign='center';X.textBaseline='middle';
    X.fillText('SHORT SCHLIESSEN = AKTIVER BUY',cx,cy+89);
    X.restore();
  }
  // buying-power push (16.5+ / gap 21.9)
  const pu=clamp((t-gS5(21.9)-OFF5+21.9- (21.9-16.6))/2.6,0,1); // ramp from ~16.6
  const push=clamp((t-sT5(16.6))/( (gS5(21.9)+3.0+OFF5-0)-sT5(16.6)),0,1);
  if(push>0){
    X.save();X.globalAlpha=0.85;
    const gx=xOf(16), gy0=yOf(29695), gx1=xOf(40), gy1=yOf(29825);
    const g=X.createLinearGradient(0,gy0,0,gy1);
    g.addColorStop(0,hexA(GRN,0));g.addColorStop(1,hexA(GRN,0.30));
    X.fillStyle=g;
    const hh=(gy0-gy1)*es(push);
    X.fillRect(gx,gy0-hh,gx1-gx,hh);
    // big arrow
    X.strokeStyle=GRN;X.lineWidth=6;X.lineCap='round';
    const ay0=gy0-6, ay1=gy0-hh+8;
    X.beginPath();X.moveTo((gx+gx1)/2,ay0);X.lineTo((gx+gx1)/2,ay1);
    X.moveTo((gx+gx1)/2-16,ay1+24);X.lineTo((gx+gx1)/2,ay1);X.lineTo((gx+gx1)/2+16,ay1+24);X.stroke();
    X.restore();
    X.save();X.globalAlpha=clamp((t-sT5(19.9))/0.5,0,1);
    X.fillStyle='rgba(8,153,129,0.96)';rr(X,(gx+gx1)/2-120,(gy0+gy1)/2-16,240,30,6);X.fill();
    X.fillStyle='#fff';X.font='800 15px '+SANS;X.textAlign='center';X.textBaseline='middle';
    X.fillText('PURE BUYING POWER ↑',(gx+gx1)/2,(gy0+gy1)/2-1);
    X.restore();
  }
}

// ---- lower thirds ----
