<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070a10}canvas{position:absolute;left:0;top:0}</style>
</head><body><canvas id="cv" width="1920" height="1080"></canvas><script>
const X=document.getElementById('cv').getContext('2d');const W=1920,H=1080;
const BG='#070a10',INK='#eaf2f8',MUT='#8b98a8',DIM='#5a6a80',LIME='#b6f04a',CYAN='#39d0d0',MAG='#e06bd8',RED='#ff5470',GRN='#33e08a',GOLD='#ffcf5c';
const SANS='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',MONO='ui-monospace,"SF Mono",Menlo,monospace';
const P=Math.round;let T=0;
const clamp=(u,a,b)=>u<a?a:u>b?b:u;
const es=u=>{u=clamp(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const eo=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3);};
const bo=u=>{u=clamp(u,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
const rr=(x,y,w,h,r)=>{x=P(x);y=P(y);w=P(w);h=P(h);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();};
const rnd=s=>{s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s);};
const sA=(t0,t1)=>{const i=clamp((T-t0)/0.4,0,1),o=clamp((t1-T)/0.4,0,1);return Math.max(0,Math.min(i,o));};
const rv=(t0,d)=>es(clamp((T-t0)/(d||0.5),0,1));
const ry=(t0,d)=>{const u=clamp((T-t0)/(d||0.55),0,1);return (1-bo(u))*22;};
function pbox(x,y,w,h,col,a){X.fillStyle='rgba(12,18,26,0.5)';rr(x,y,w,h,18);X.fill();X.strokeStyle=hexA(col,a==null?0.5:a);X.lineWidth=2;rr(x,y,w,h,18);X.stroke();}
function kick(txt,x,y,col){X.save();X.fillStyle=col;X.font='800 26px '+MONO;X.textAlign='left';X.textBaseline='alphabetic';X.fillText('● '+txt,P(x),P(y));X.restore();}
function chkIcon(cx,cy,good,col,r){r=r||16;X.save();X.translate(P(cx),P(cy));X.fillStyle=col;X.beginPath();X.arc(0,0,r,0,7);X.fill();X.strokeStyle='#0a0e10';X.lineWidth=3.5;X.lineCap='round';X.lineJoin='round';
  if(good){X.beginPath();X.moveTo(-r*0.42,0);X.lineTo(-r*0.1,r*0.38);X.lineTo(r*0.5,-r*0.44);X.stroke();}else{X.beginPath();X.moveTo(-r*0.4,-r*0.4);X.lineTo(r*0.4,r*0.4);X.moveTo(r*0.4,-r*0.4);X.lineTo(-r*0.4,r*0.4);X.stroke();}X.restore();}
function bg(){X.fillStyle=BG;X.fillRect(0,0,W,H);
  X.save();X.globalAlpha=0.045;X.strokeStyle='#5a6a80';X.lineWidth=1;const ox=P((T*8)%80);
  for(let x=-80+ox;x<W;x+=80){X.beginPath();X.moveTo(P(x)+0.5,0);X.lineTo(P(x)+0.5,H);X.stroke();}
  for(let y=0;y<H;y+=80){X.beginPath();X.moveTo(0,y+0.5);X.lineTo(W,y+0.5);X.stroke();}X.restore();
  [[360,300,RED],[1560,760,MAG],[1180,220,GOLD]].forEach((o,i)=>{const ph=T*0.2+i*2.1;const gx=o[0]+Math.sin(ph)*50,gy=o[1]+Math.cos(ph*0.8)*38;
    const g=X.createRadialGradient(gx,gy,0,gx,gy,540);g.addColorStop(0,hexA(o[2],0.07));g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(gx-540,gy-540,1080,1080);});}
function vignette(){const g=X.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.9);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.5)');X.fillStyle=g;X.fillRect(0,0,W,H);}
function cap(txt,col,t0,t1){const a=sA(t0,t1);if(a<=0)return;X.save();X.globalAlpha=a;X.textAlign='center';X.textBaseline='middle';
  const y=H-112;X.font='800 38px '+SANS;const w=X.measureText(txt).width+76;X.fillStyle='#0c1420';rr(W/2-w/2,y-38,w,76,16);X.fill();
  X.strokeStyle=hexA(col,0.7);X.lineWidth=2;rr(W/2-w/2,y-38,w,76,16);X.stroke();X.fillStyle=INK;X.fillText(txt,P(W/2),P(y));X.restore();}
function wrapText(txt,x,y,maxw,lh){const ws=txt.split(' ');let line='',yy=y;const lines=[];
  for(const w of ws){const t=line?line+' '+w:w;if(X.measureText(t).width>maxw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);
  const sy=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>X.fillText(l,P(x),P(sy+i*lh)));}
function wrapC(txt,cx,y,maxw,lh){X.textAlign='center';const ws=txt.split(' ');let line='';const lines=[];
  for(const w of ws){const t=line?line+' '+w:w;if(X.measureText(t).width>maxw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);
  const sy=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>X.fillText(l,P(cx),P(sy+i*lh)));}
function wrapL(txt,x,y,maxw,lh){X.textAlign='left';const ws=txt.split(' ');let line='';const lines=[];
  for(const w of ws){const t=line?line+' '+w:w;if(X.measureText(t).width>maxw&&line){lines.push(line);line=w;}else line=t;}lines.push(line);
  lines.forEach((l,i)=>X.fillText(l,P(x),P(y+i*lh)));}
function avatar(cx,cy,r,col){X.save();X.translate(P(cx),P(cy));X.strokeStyle=col;X.lineWidth=3.5;X.lineCap='round';X.lineJoin='round';
  X.beginPath();X.arc(0,-r*0.32,r*0.34,0,7);X.stroke();
  X.beginPath();X.arc(0,r*0.62,r*0.62,Math.PI*1.12,Math.PI*1.88);X.stroke();X.restore();}

// ---------- SCENE 1: TITLE 0-26.2 ----------
function scTitle(){const a=sA(0,26.2);if(a<=0)return;X.save();X.globalAlpha=a;X.textAlign='center';X.textBaseline='middle';
  const kk=rv(0.2,0.5);if(kk>0){X.fillStyle=CYAN;X.font='800 30px '+MONO;X.fillText('● LESSON 4',P(W/2),P(H/2-210+(1-kk)*20));}
  X.font='900 116px '+SANS;const lines=['WHAT IS','RETAIL MONEY?'];
  lines.forEach((l,i)=>{const lu=rv(0.5+i*0.28,0.7);if(lu<=0)return;X.save();X.globalAlpha*=Math.min(1,lu*1.2);
    X.fillStyle=i===1?CYAN:INK;if(i===1){X.shadowColor=hexA(CYAN,0.5);X.shadowBlur=28;}
    X.fillText(l,P(W/2),P(H/2-90+i*118+(1-bo(lu))*40));X.restore();});
  const s1=rv(10.44,0.6);if(s1>0){X.save();X.globalAlpha*=Math.min(1,s1*1.2);X.fillStyle=MUT;X.font='600 36px '+SANS;
    X.fillText('The market is not one anonymous crowd — it has SIDES',P(W/2),P(H/2+150));X.restore();}
  const s2=rv(14.24,0.6);if(s2>0){X.save();X.globalAlpha*=Math.min(1,s2*1.2);X.fillStyle=LIME;X.font='800 40px '+SANS;
    X.fillText('Today decides which side you are on',P(W/2),P(H/2+230));X.restore();}
  X.restore();}
// ---------- SCENE 2: DEFINE 26.2-33.6 ----------
function scDefine(){const a=sA(26.2,33.6);if(a<=0)return;X.save();X.globalAlpha=a;
  kick('DEFINE IT PROPERLY',150,150,CYAN);
  const u=rv(28.28,0.7);if(u>0){X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(28.28));
    pbox(W/2-780,340,1560,360,CYAN,0.55);
    X.textAlign='center';X.textBaseline='middle';X.fillStyle=CYAN;X.font='800 26px '+MONO;X.fillText('RETAIL TRADER',P(W/2),P(410));
    X.fillStyle=INK;X.font='800 54px '+SANS;
    X.fillText('A private market participant',P(W/2),P(500));

    const wa=X.measureText(l2a).width,wb=X.measureText(l2b).width,tot=wa+wb,sx=W/2-tot/2;
    X.textAlign='left';X.fillStyle=INK;X.fillText(l2a,P(sx),P(575));X.fillStyle=LIME;X.fillText(l2b,P(sx+wa),P(575));
    X.restore();}
  X.restore();}
// ---------- SCENE 3: PERSONAS 33.6-51.2 ----------
const PERS=[[34.18,'THE BEGINNER','first €500 in the account',RED],
            [37.1,'HOBBY TRADER','checks charts on lunch break',GOLD],
            [40.22,'YOUTUBE TRADER','copies setups from videos',MAG],
            [43.8,'SMALL INVESTOR','a broker app on his phone',CYAN]];
function scPersonas(){const a=sA(33.6,51.2);if(a<=0)return;X.save();X.globalAlpha=a;
  kick('VERY DIFFERENT PEOPLE',150,150,CYAN);
  const cw=400,gap=30,x0=(W-(4*cw+3*gap))/2,y=300,ch=440;
  PERS.forEach((p,i)=>{const u=rv(p[0],0.5);if(u<=0)return;const x=x0+i*(cw+gap);X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(p[0]));
    pbox(x,y,cw,ch,p[3],0.6);
    avatar(x+cw/2,y+130,86,p[3]);
    X.textAlign='center';X.textBaseline='middle';X.fillStyle=p[3];X.font='900 34px '+SANS;X.fillText(p[1],P(x+cw/2),P(y+270));
    X.fillStyle=MUT;X.font='600 25px '+SANS;wrapC(p[2],x+cw/2,y+340,cw-70,32);X.restore();});
  const cu=rv(49.04,0.5);if(cu>0){X.save();X.globalAlpha*=Math.min(1,cu*1.2);X.textAlign='center';X.textBaseline='middle';
    X.fillStyle=LIME;X.font='800 42px '+SANS;X.fillText('…but look at what they ALL share',P(W/2),P(y+ch+90));X.restore();}
  X.restore();}
// ---------- SCENE 4: SHARED 51.2-72.2 ----------
const SHAR=[[51.2,'Small–medium capital','they cannot move the market',RED],
            [55.62,'Limited information','nobody sells them the real data feeds',GOLD],
            [60.3,'The same free education','same YouTube, same free sources',MAG]];

  SHAR.forEach((s,i)=>{const u=rv(s[0],0.5);if(u<=0)return;const y=270+i*130;X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(s[0]));
    pbox(W/2-720,y,1440,108,s[3],0.5);
    chkIcon(W/2-660,y+54,false,s[3],17);
    X.textAlign='left';X.textBaseline='middle';X.fillStyle=INK;X.font='800 38px '+SANS;X.fillText(s[1],P(W/2-600),P(y+54));
    X.fillStyle=MUT;X.font='600 27px '+SANS;X.textAlign='right';X.fillText(s[2],P(W/2+680),P(y+54));X.restore();});
  const cu=rv(67.4,0.6);if(cu>0){X.save();X.globalAlpha*=Math.min(1,cu*1.2);X.translate(0,ry(67.4));
    pbox(W/2-560,700,1120,130,LIME,0.75);X.textAlign='center';X.textBaseline='middle';
    X.fillStyle=LIME;X.font='900 48px '+SANS;X.fillText('=  Almost IDENTICAL strategies',P(W/2),P(765));X.restore();}
  X.restore();}
// ---------- SCENE 5: MASS 72.2-90.48 ----------
function scMass(){const a=sA(72.2,90.48);if(a<=0)return;X.save();X.globalAlpha=a;
  kick('RETAIL MONEY IS A MASS',150,150,MAG);
  const px=120,py=250,pw=760,ph=560;pbox(px,py,pw,ph,MAG,0.5);
  const cols=16,rows=11,mx=px+50,my=py+70,sx=(pw-100)/(cols-1),sy=(ph-140)/(rows-1);
  // single highlighted person first
  const single=rv(75.46,0.4);
  // mass fills in
  const fill=clamp((T-77.96)/2.4,0,1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const idx=r*cols+c;const jx=(rnd(idx*1.7)-0.5)*10,jy=(rnd(idx*2.3)-0.5)*10;
    const dx=mx+c*sx+jx,dy=my+r*sy+jy;const isHi=(r===5&&c===8);
    let dv;if(isHi)dv=single; else dv=clamp((fill*(cols*rows+8)-idx)/8,0,1);
    if(dv<=0)continue;X.save();X.globalAlpha*=dv;
    X.fillStyle=isHi?CYAN:hexA(MAG,0.7);X.beginPath();X.arc(P(dx),P(dy),isHi?8:6,0,7);X.fill();X.restore();}
  if(single>0&&fill<0.15){X.save();X.globalAlpha*=Math.min(1,single);X.textAlign='center';X.textBaseline='middle';
    X.fillStyle=CYAN;X.font='700 22px '+MONO;X.fillText('one person',P(mx+8*sx),P(my+5*sy-30));X.restore();}
  // right text
  const rx=960;
  const t1=rv(75.46,0.5);if(t1>0){X.save();X.globalAlpha*=Math.min(1,t1*1.2);X.textAlign='left';X.textBaseline='middle';
    X.fillStyle=MUT;X.font='700 40px '+SANS;X.fillText('Not one person…',P(rx),P(340));X.restore();}
  const t2=rv(77.96,0.6);if(t2>0){X.save();X.globalAlpha*=Math.min(1,t2*1.2);X.translate(0,ry(77.96));X.textAlign='left';X.textBaseline='middle';
    X.fillStyle=INK;X.font='900 56px '+SANS;X.fillText('…the huge,',P(rx),P(440));
    X.fillStyle=MAG;X.fillText('predictable MASS',P(rx),P(510));X.restore();}
  const t3=rv(80.52,0.5);if(t3>0){X.save();X.globalAlpha*=Math.min(1,t3*1.2);X.textAlign='left';X.textBaseline='middle';
    X.fillStyle=MUT;X.font='600 30px '+SANS;wrapL('acting the same way, at the same spots',rx,600,800,38);X.restore();}
  const t4=rv(85.98,0.5);if(t4>0){X.save();X.globalAlpha*=Math.min(1,t4*1.2);X.textAlign='left';X.textBaseline='middle';
    X.fillStyle=MAG;X.font='900 44px '+SANS;X.fillText('Not a person — a MASS',P(rx),P(720));X.restore();}
  X.restore();}
// ---------- SCENE 6: SOURCES 90.48-133.86 ----------
function scSources(){const a=sA(90.48,133.86);if(a<=0)return;X.save();X.globalAlpha=a;
  kick('WHERE DID YOU LEARN?',150,140,GOLD);
  const q=rv(90.6,0.6);if(q>0){X.save();X.globalAlpha*=Math.min(1,q*1.2);X.textAlign='center';X.textBaseline='middle';

  const sub=rv(97.5,0.5);if(sub>0){X.save();X.globalAlpha*=Math.min(1,sub*1.2);X.textAlign='center';X.textBaseline='middle';
    X.fillStyle=GOLD;X.font='700 32px '+SANS;X.fillText('It comes down to exactly TWO sources',P(W/2),P(320));X.restore();}
  // two columns
  const cols=[[100.4,GOLD,'SOURCE 1','SOCIAL MEDIA',['YouTube','Instagram','TikTok','Discord groups']],
             [101.2,MAG,'SOURCE 2','STANDARD EDUCATION',['Support & Resistance','Trendlines','Chart patterns','RSI · MACD']]];
  cols.forEach((c,i)=>{const u=rv(c[0],0.6);if(u<=0)return;const x=i===0?150:1010,w=760,y=380,h=380;X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,ry(c[0]));
    pbox(x,y,w,h,c[1],0.6);X.textAlign='left';X.textBaseline='alphabetic';
    X.fillStyle=c[1];X.font='800 24px '+MONO;X.fillText('▸ '+c[2],P(x+40),P(y+58));
    X.fillStyle=INK;X.font='900 46px '+SANS;X.fillText(c[3],P(x+40),P(y+118));
    c[4].forEach((it,k)=>{const yy=y+180+k*54;X.fillStyle=hexA(c[1],0.9);X.beginPath();X.arc(P(x+52),P(yy-9),6,0,7);X.fill();
      X.fillStyle=INK;X.font='600 30px '+SANS;X.fillText(it,P(x+76),P(yy));});X.restore();});
  const cu=rv(102.54,0.6);if(cu>0){X.save();X.globalAlpha*=Math.min(1,cu*1.2);X.translate(0,ry(102.54));X.textAlign='center';X.textBaseline='middle';
    pbox(W/2-460,810,920,120,RED,0.75);X.fillStyle=RED;X.font='900 46px '+SANS;X.fillText('→  Both produce the SAME result',P(W/2),P(870));X.restore();}
  X.restore();}

// ---------- SCENE 8: CHAIN 175.46-196.18 ----------
const CHN=[[176.0,'SAME EDUCATION',MUT],[181.26,'SAME ANALYSIS',GOLD],[184.62,'SAME POSITIONING',MAG],[187.88,'CROWD TRADES IDENTICALLY',RED]];

    if(i>0){const au=rv(n[0]-0.1,0.4);if(au>0){X.save();X.globalAlpha*=Math.min(1,au);X.strokeStyle=hexA(n[2],0.7);X.fillStyle=hexA(n[2],0.7);X.lineWidth=5;X.lineCap='round';
      const ax=x-gap-4,ay=y+bh/2;X.beginPath();X.moveTo(ax-gap+14,ay);X.lineTo(ax-6,ay);X.stroke();
      X.beginPath();X.moveTo(ax-2,ay);X.lineTo(ax-18,ay-11);X.lineTo(ax-18,ay+11);X.closePath();X.fill();X.restore();}}});
  const q=rv(193.52,0.5);if(q>0){X.save();X.globalAlpha*=Math.min(1,q*1.2);X.textAlign='center';X.textBaseline='middle';

// ---------- SCENE 9: VISIBLE 196.18-210.98 ----------
function scVisible(){const a=sA(196.18,210.98);if(a<=0)return;X.save();X.globalAlpha=a;
  kick('THE CROWD IS VISIBLE',150,140,RED);
  const px=130,py=250,pw=1060,ph=560;pbox(px,py,pw,ph,RED,0.4);
  // price line
  const N=64;const pts=[];for(let i=0;i<N;i++){const u=i/(N-1);
    let v=0.30+0.22*Math.sin(u*4.2)+0.10*Math.sin(u*11)+0.34*u+(rnd(i*3.1)-0.5)*0.04;
