<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0e14;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('cv'),X=cv.getContext('2d');
const BG='#0a0e14',PANEL='#111823',PANEL2='#0e141d',LINE='#22304a',
      INK='#eaf2f8',MUTED='#8b98a8',LIME='#b6f04a',CYAN='#39d0d0',MAGB='#e06bd8',RED='#ef5350';
const SANS='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
let T=0;
const es=u=>u<0?0:u>1?1:(u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2);
function A(t0,k=0){return es((T/1000-t0-k*0.22)/0.48);}
function bo(u){const c1=1.70158,c3=c1+1;return u<0?0:u>1?1:1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);}
function grp(u,fn){if(u<=0)return;X.save();X.globalAlpha*=Math.min(1,u*1.2);
  X.translate(0,(1-bo(u))*30);fn();X.restore();}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function splitT(t,mc){const ws=t.split(' ');const o=[];let l='';for(const w of ws){const c=l?l+' '+w:w;if(c.length>mc&&l){o.push(l);l=w;}else l=c;}o.push(l);return o;}
function badgeDot(x,y,n,pulse=0){
  X.save();X.shadowColor='rgba(182,240,74,.55)';X.shadowBlur=26+18*pulse;
  X.fillStyle=LIME;X.beginPath();X.arc(x,y,54,0,7);X.fill();X.restore();
  X.fillStyle='#0c1608';X.font='900 54px '+SANS;X.textAlign='center';X.textBaseline='middle';X.fillText(String(n),x,y+2);}
function chapterCard(cx,cy,title,w=1060,pulse=0,tEnd=1e9){
  const lines=splitT(title,24),h=190+lines.length*88;
  X.save();X.shadowColor=`rgba(182,240,74,${0.22+0.16*pulse})`;X.shadowBlur=60+30*pulse;
  X.fillStyle=PANEL;rr(cx-w/2,cy-h/2,w,h,28);X.fill();X.restore();
  X.strokeStyle=`rgba(182,240,74,${0.5+0.3*pulse})`;X.lineWidth=2.5;rr(cx-w/2,cy-h/2,w,h,28);X.stroke();
  X.font='700 24px ui-monospace,monospace';X.fillStyle=LIME;X.textAlign='center';X.textBaseline='middle';
  X.fillText('● CHAPTER',cx,cy-h/2+54);
  X.font='900 76px '+SANS;
  let fs2=76,maxw=0;
  lines.forEach(l=>{const m=X.measureText(l).width;if(m>maxw)maxw=m;});
  if(maxw>w-150)fs2=Math.floor(76*(w-150)/maxw);
  X.font='900 '+fs2+'px '+SANS;X.fillStyle=INK;
  lines.forEach((l,i)=>X.fillText(l,cx,cy+30+(i-(lines.length-1)/2)*88));
  const uw=w-160;
  X.strokeStyle='rgba(182,240,74,.5)';X.lineWidth=3;X.lineCap='round';
  const sx0=cx-uw/2;
  X.beginPath();X.moveTo(sx0,cy+h/2-28);X.lineTo(sx0+uw,cy+h/2-28);X.stroke();
  if(T/1000<tEnd){
    const hx=sx0+uw*(0.5+0.5*Math.sin(T/1000*1.1));
    X.save();X.shadowColor='rgba(182,240,74,.9)';X.shadowBlur=14;
    X.fillStyle=LIME;X.beginPath();X.arc(hx,cy+h/2-28,5,0,7);X.fill();X.restore();}}
function slideCard(x,y,w,h,heading){
  X.fillStyle=PANEL;rr(x,y,w,h,22);X.fill();
  X.strokeStyle=LINE;X.lineWidth=1.5;rr(x,y,w,h,22);X.stroke();
  if(heading){X.font='700 34px '+SANS;X.fillStyle=MUTED;X.textAlign='left';X.textBaseline='alphabetic';X.fillText(heading,x+48,y+72);}}
function sticky(x,y,w,h,text,accent=CYAN,fs=27){
  X.fillStyle=PANEL2;rr(x,y,w,h,16);X.fill();
  X.strokeStyle=accent;X.lineWidth=2;rr(x,y,w,h,16);X.stroke();
  X.fillStyle=accent;rr(x+2,y+10,5,h-20,2.5);X.fill();
  X.font='600 '+fs+'px '+SANS;
  const ws=text.split(' ');let lines=[],l='';
  for(const wd of ws){const t2=l?l+' '+wd:wd;if(X.measureText(t2).width>w-56&&l){lines.push(l);l=wd;}else l=t2;}
  lines.push(l);
  const lh=fs*1.34,sy=y+h/2-(lines.length-1)*lh/2;
  X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';
  lines.forEach((ln,i)=>X.fillText(ln,x+w/2+3,sy+i*lh));}
function colCardRv(x,y,w,title,items,accent,t0,k0){
  const h=170+items.length*58;const u0=A(t0,k0);if(u0<=0)return;
  X.save();X.globalAlpha*=u0;
  X.fillStyle=PANEL;rr(x,y,w,h,20);X.fill();
  X.strokeStyle=accent;X.lineWidth=2;rr(x,y,w,h,20);X.stroke();
  X.fillStyle=accent;rr(x,y,w,76,20);X.fill();X.fillRect(x,y+58,w,18);
  X.fillStyle='#0c1014';X.font='800 30px '+SANS;X.textAlign='center';X.textBaseline='middle';X.fillText(title,x+w/2,y+40);
  X.restore();
  X.textAlign='left';
  items.forEach((b,i)=>{const u=A(t0,k0+1+i*0.9);if(u<=0)return;
    X.save();X.globalAlpha*=u;const yy=y+134+i*58+(1-u)*14;
    X.fillStyle=accent;X.beginPath();X.arc(x+36,yy,5.5,0,7);X.fill();
    X.font='500 27px '+SANS;X.fillStyle=INK;X.fillText(b,x+58,yy);X.restore();});}
function route(pts){
  X.save();X.strokeStyle='rgba(182,240,74,.35)';X.lineWidth=4;X.setLineDash([2,20]);
  X.lineDashOffset=-(T/90)%22; X.lineCap='round';
  X.beginPath();X.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){const [x,y]=pts[i],[px,py]=pts[i-1];
    X.bezierCurveTo(px+(x-px)*0.5,py,x-(x-px)*0.5,y,x,y);}
  X.stroke();X.restore();}
function bigLine(cx,cy,w,h,lines,t0,fs=44){
  grp(A(t0,0),()=>{
    X.save();X.shadowColor='rgba(182,240,74,.25)';X.shadowBlur=40;
    X.fillStyle=PANEL2;rr(cx-w/2,cy,w,h,18);X.fill();X.restore();
    X.strokeStyle='rgba(182,240,74,.55)';X.lineWidth=2;rr(cx-w/2,cy,w,h,18);X.stroke();});
  lines.forEach((ln,i)=>{const u=A(t0,0.8+i*0.8);if(u<=0)return;
    X.save();X.globalAlpha*=u;X.font='800 '+fs+'px '+SANS;X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';
    X.fillText(ln,cx,cy+h/2-(lines.length-1)*fs*0.68+i*fs*1.36+(1-u)*12);X.restore();});
  const sw=(T/1000-t0-1.6)/1.4;
  if(sw>0&&sw<1){X.save();rr(cx-w/2,cy,w,h,18);X.clip();
    const gx=cx-w/2+(w+240)*sw-120;
    const g=X.createLinearGradient(gx-90,0,gx+90,0);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,0.10)');g.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=g;X.fillRect(cx-w/2,cy,w,h);X.restore();}}
/* clip anchors */
const T01=0.2,T02=26.24,T03=72.8,T04=90.89,T05=106.97,T06=148.76,T07=175.71,
      T08=211.46,T09=226.37,T10=259.17,T11=290.22,T12=341.17,T13=370.57,T14=407.6;
const ACT=[[0,90.9,1],[90.9,209.7,2],[209.7,288.4,3],[288.4,405.8,4],[405.8,999,5]];
function pulseFor(cl){const t=T/1000;
  for(const [a,b,c] of ACT){if(c===cl&&t>=a&&t<b)return 0.5+0.5*Math.sin(T/420);}return 0;}
function pill(x,y,w,h,txt,col,fs=34){
  X.fillStyle=PANEL;rr(x,y,w,h,h/2);X.fill();
  X.strokeStyle=col;X.lineWidth=2.5;rr(x,y,w,h,h/2);X.stroke();
  X.font='800 '+fs+'px '+SANS;X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';
  X.fillText(txt,x+w/2,y+h/2+2);}
function drawWorld(){
  X.fillStyle=BG;X.fillRect(-3000,-2000,19000,9000);
  X.save();X.globalAlpha=0.045;X.strokeStyle='#8b98a8';X.lineWidth=1;
  for(let gx=-3000;gx<16000;gx+=160){X.beginPath();X.moveTo(gx,-2000);X.lineTo(gx,7000);X.stroke();}
  for(let gy=-2000;gy<7000;gy+=160){X.beginPath();X.moveTo(-3000,gy);X.lineTo(16000,gy);X.stroke();}
  X.restore();
  const orbs=[[2600,900,'182,240,74'],[7300,2100,'57,208,208'],[11800,1400,'224,107,216']];
  orbs.forEach((o,i)=>{
    const ph=T/1000*0.06+i*2.1;
    const ox=o[0]+Math.sin(ph)*260, oy=o[1]+Math.cos(ph*0.8)*180;
    const g=X.createRadialGradient(ox,oy,0,ox,oy,900);
    g.addColorStop(0,`rgba(${o[2]},0.05)`);g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;X.fillRect(ox-900,oy-900,1800,1800);
  });
  route([[1500,530],[4300,530],[7300,530],[10200,530],[12600,1730]]);
  /* ---- S1: WHAT IS RETAIL MONEY? ---- */
  grp(A(T01),()=>badgeDot(1500,530,1,pulseFor(1)));
  grp(A(T01,0.5),()=>chapterCard(1500,760,'WHAT IS RETAIL MONEY?',1140,pulseFor(1),T02));
  grp(A(T02,0),()=>slideCard(820,1030,1360,700,'Definition'));
  grp(A(T02+2,0),()=>sticky(940,1110,1120,120,'Private market participants trading their own capital.',LIME,30));
  colCardRv(900,1290,540,'EXAMPLES',['Beginners','Hobby traders','YouTube traders','Small investors'],CYAN,T02+12,0);
  colCardRv(1480,1290,540,'SHARED TRAITS',['Small–medium capital','Limited information','Same education','Same strategies'],MAGB,T02+27,0);
  bigLine(1500,1810,1240,150,['Retail money = the huge mass of private traders.'],T03+0.5,34);
  /* ---- S2: EVERYONE LEARNS THE SAME ---- */
  grp(A(T04),()=>badgeDot(4300,530,2,pulseFor(2)));
  grp(A(T04,0.5),()=>chapterCard(4300,760,'EVERYONE LEARNS THE SAME',1240,pulseFor(2),T05));
  colCardRv(3560,1060,500,'SOCIAL MEDIA',['YouTube','Instagram','TikTok','Discord groups'],CYAN,T05+2,0);
  colCardRv(4540,1060,500,'STANDARD EDUCATION',['Support & resistance','Trendlines','Chart patterns','RSI & MACD'],CYAN,T05+16,0);
  bigLine(4300,1600,1480,240,['Everyone learns the same concepts.','Everyone sees the same setups.','Everyone places similar stop losses.'],T06+2.5,32);
  const p2=['SAME EDUCATION','SAME ANALYSIS','SAME POSITIONING'];
  p2.forEach((p,i)=>{
    const x=3400+i*(520+120);
    grp(A(T07+3+i*5.5,0),()=>pill(x,2000,520,120,p,CYAN,28));
    if(i<2){const u=A(T07+5.5+i*5.5,0);if(u>0){
      X.save();X.globalAlpha*=u;X.strokeStyle='rgba(234,242,248,.55)';X.lineWidth=4;X.lineCap='round';
      X.beginPath();X.moveTo(x+520+16,2060);X.lineTo(x+520+104,2060);X.stroke();
      X.fillStyle='rgba(234,242,248,.55)';
      X.beginPath();X.moveTo(x+520+104,2047);X.lineTo(x+520+104,2073);X.lineTo(x+520+122,2060);X.closePath();X.fill();X.restore();}}
  });
  bigLine(4300,2230,1360,150,['The crowd often trades identically.'],T07+21,38);
  /* ---- S3: WHY CLASSIC TOOLS FALL SHORT ---- */
  grp(A(T08),()=>badgeDot(7300,530,3,pulseFor(3)));
  grp(A(T08,0.5),()=>chapterCard(7300,790,'WHY CLASSIC TOOLS FALL SHORT',1240,pulseFor(3),T09));
  colCardRv(6560,1100,460,'SUPPORT & RESISTANCE',['Shows where something','COULD happen'],CYAN,T09+1,0);
  colCardRv(7080,1100,460,'RSI',['Shows what has','ALREADY happened'],MAGB,T09+9,0);
  colCardRv(7600,1100,460,'CHART PATTERNS',['Probabilities —','never the cause'],RED,T09+19,0);
  const qs=['Why is the market moving?','Who is buying?','Who is selling?','Where is the liquidity?'];
  qs.forEach((q,i)=>{
    const x=6590+(i%2)*780, y=1530+Math.floor(i/2)*150;
    grp(A(T10+3+i*3.6,0),()=>sticky(x,y,700,110,q,LIME,29));
  });
  bigLine(7300,1900,1560,150,['Retail methods show the result — not the cause.'],T10+21,38);
  /* ---- S4: THE SOLUTION: LEVEL 2 DATA ---- */
  grp(A(T11),()=>badgeDot(10200,530,4,pulseFor(4)));
  grp(A(T11,0.5),()=>chapterCard(10200,790,'THE SOLUTION: LEVEL 2 DATA',1240,pulseFor(4),T11+3));
  {const u=A(T11+3,0);if(u>0){X.save();X.globalAlpha*=u;
    X.shadowColor='rgba(182,240,74,.4)';X.shadowBlur=60;
    X.fillStyle=PANEL;rr(9500,1080,1400,170,85);X.fill();X.shadowBlur=0;
    X.strokeStyle=LIME;X.lineWidth=3;rr(9500,1080,1400,170,85);X.stroke();
    X.font='900 72px '+SANS;X.fillStyle=LIME;X.textAlign='center';X.textBaseline='middle';
    X.fillText('LEVEL 2 DATA',10200,1168);X.restore();}}
  colCardRv(9450,1330,600,'RETAIL TRADERS SEE',['The price','A few indicators'],MAGB,T11+12,0);
  colCardRv(10350,1330,600,'INSTITUTIONS SEE',['Price + order book','Level 2 data','Liquidity & market depth'],LIME,T11+24,0);
  /* ---- S5: THE SHIFT ---- */
  grp(A(T12),()=>badgeDot(12600,1730,5,pulseFor(5)));
  const steps=[
    ['BEFORE','RSI · trendlines · classic retail setups',CYAN,T12+2,36],
    ['INSIGHT','"If the majority trades the same concepts and still loses —',T12+7],
    ['CHANGE','Participants · liquidity · level 2 · the cause behind moves',LIME,T13+0.5,36],
    ['RESULT','More understanding · better decisions · less flying blind',LIME,T13+7,36]];
  // BEFORE
  grp(A(T12+3,0),()=>{pill(11750,1860,360,110,'BEFORE',MAGB,30);
    X.font='600 33px '+SANS;X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';
    X.fillText('RSI · trendlines · classic retail setups',12190,1917);});
  grp(A(T12+15,0),()=>{pill(11750,2050,360,110,'INSIGHT',CYAN,30);
    X.font='600 31px '+SANS;X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';
    X.fillText('If the majority trades the same concepts and still',12190,2085);
    X.fillText('loses — why would you trade the same way?',12190,2127);});
  grp(A(T13+2,0),()=>{pill(11750,2240,360,110,'CHANGE',LIME,30);
    X.font='600 33px '+SANS;X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';
    X.fillText('Participants · liquidity · level 2 · the cause',12190,2297);});
  grp(A(T13+20,0),()=>{pill(11750,2430,360,110,'RESULT',LIME,30);
    X.font='600 33px '+SANS;X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';
    X.fillText('More understanding · better decisions · no blind flight',12190,2487);});
  grp(A(T14+1.5,0),()=>{
    X.save();X.shadowColor='rgba(182,240,74,.3)';X.shadowBlur=70;
    X.fillStyle=PANEL;rr(11750,2650,1800,380,26);X.fill();X.restore();
    X.strokeStyle='rgba(182,240,74,.6)';X.lineWidth=3;rr(11750,2650,1800,380,26);X.stroke();
    X.font='700 24px ui-monospace,monospace';X.fillStyle=LIME;X.textAlign='center';X.textBaseline='middle';
    X.fillText('● BOTTOM LINE',12650,2722);});
  ['Understand the cause —','not just the result.'].forEach((ln,i)=>{
    const u=A(T14+3.0,0.4+i*0.8);if(u<=0)return;
    X.save();X.globalAlpha*=u;X.font='900 64px '+SANS;X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';
    X.fillText(ln,12650,2830+i*84+(1-u)*14);X.restore();});
}
/* camera */
const HOLDVIEW=[
  {a:0.0,b:24.44,v:{x:1500,y:730,z:1.1}},
  {a:26.24,b:71.0,v:{x:1500,y:1380,z:1.2}},
  {a:72.8,b:89.09,v:{x:1500,y:1495,z:1.05}},
  {a:90.89,b:105.17,v:{x:4300,y:700,z:1.1}},
  {a:106.97,b:173.91,v:{x:4300,y:1500,z:1.15}},
  {a:175.71,b:209.66,v:{x:4300,y:2050,z:1.0}},
  {a:211.46,b:257.37,v:{x:7300,y:1440,z:1.2}},
  {a:259.17,b:288.42,v:{x:7300,y:1580,z:1.0}},
  {a:290.22,b:339.37,v:{x:10200,y:1500,z:1.05}},
  {a:341.17,b:405.8,v:{x:12625,y:2100,z:1.05}},
  {a:407.6,b:430.29,v:{x:12650,y:2450,z:0.85}}
];
function camAt(tms){const t=tms/1000;
  if(t<=HOLDVIEW[0].b)return HOLDVIEW[0].v;
  for(let i=0;i<HOLDVIEW.length;i++){const h=HOLDVIEW[i];
    if(t>=h.a&&t<=h.b)return h.v;
    if(i<HOLDVIEW.length-1){const n=HOLDVIEW[i+1];
      if(t>h.b&&t<n.a){const u=es((t-h.b)/(n.a-h.b));
        return {x:h.v.x+(n.v.x-h.v.x)*u,y:h.v.y+(n.v.y-h.v.y)*u,z:h.v.z+(n.v.z-h.v.z)*u};}}}
  return HOLDVIEW[HOLDVIEW.length-1].v;}
function renderAt(t){
  T=t;const c0=camAt(t);
  const c=c0;  // pixel-locked during holds (no breathing drift)
  X.setTransform(1,0,0,1,0,0);X.fillStyle=BG;X.fillRect(0,0,1920,1080);
  X.setTransform(c.z,0,0,c.z,960-c.x*c.z,540-c.y*c.z);
  drawWorld();
  X.setTransform(1,0,0,1,0,0);
}
window.renderAt=renderAt;window.__ready=true;renderAt(0);
</script></body></html>
