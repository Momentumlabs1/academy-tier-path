<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0e14;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('cv'),X=cv.getContext('2d');
const BG='#0a0e14',PANEL='#111823',PANEL2='#0e141d',LINE='#22304a',
      INK='#eaf2f8',MUTED='#8b98a8',LIME='#b6f04a',CYAN='#39d0d0',MAGB='#e06bd8';
const SANS='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
let T=0; // current ms
const es=u=>u<0?0:u>1?1:(u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2);
function A(t0,k=0){return es((T/1000-t0-k*0.22)/0.48);}     // reveal progress
function bo(u){const c1=1.70158,c3=c1+1;return u<0?0:u>1?1:1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);}
function grp(u,fn){if(u<=0)return;X.save();X.globalAlpha*=Math.min(1,u*1.2);X.translate(0,(1-bo(u))*30);fn();X.restore();}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function splitT(t,mc){const ws=t.split(' ');const o=[];let l='';for(const w of ws){const c=l?l+' '+w:w;if(c.length>mc&&l){o.push(l);l=w;}else l=c;}o.push(l);return o;}
function badgeDot(x,y,n,pulse=0){
  X.save();X.shadowColor='rgba(182,240,74,.55)';X.shadowBlur=26+18*pulse;
  X.fillStyle=LIME;X.beginPath();X.arc(x,y,54,0,7);X.fill();X.restore();
  X.fillStyle='#0c1608';X.font='900 54px '+SANS;X.textAlign='center';X.textBaseline='middle';X.fillText(String(n),x,y+2);}
function chapterCard(cx,cy,title,w=1060,pulse=0){
  const lines=splitT(title,24),h=190+lines.length*88;
  X.save();X.shadowColor=`rgba(182,240,74,${0.22+0.16*pulse})`;X.shadowBlur=60+30*pulse;
  X.fillStyle=PANEL;rr(cx-w/2,cy-h/2,w,h,28);X.fill();X.restore();
  X.strokeStyle=`rgba(182,240,74,${0.5+0.3*pulse})`;X.lineWidth=2.5;rr(cx-w/2,cy-h/2,w,h,28);X.stroke();
  X.font='700 24px ui-monospace,monospace';X.fillStyle=LIME;X.textAlign='center';X.textBaseline='middle';
  X.fillText('● CHAPTER',cx,cy-h/2+54);
  X.font='900 76px '+SANS;X.fillStyle=INK;
  lines.forEach((l,i)=>X.fillText(l,cx,cy+30+(i-(lines.length-1)/2)*88));
  const uw=w-160,sx0=cx-uw/2,ly=cy+h/2-28;
  X.strokeStyle='rgba(182,240,74,.45)';X.lineWidth=3;X.lineCap='round';
  X.beginPath();X.moveTo(sx0,ly);X.lineTo(sx0+uw,ly);X.stroke();
  if(pulse>0){const hx=sx0+uw*(0.5+0.5*Math.sin(T/1000*1.1));
    X.save();X.shadowColor='rgba(182,240,74,.9)';X.shadowBlur=14;X.fillStyle=LIME;
    X.beginPath();X.arc(hx,ly,5,0,7);X.fill();X.restore();}}
function slideCard(x,y,w,h,heading){
  X.fillStyle=PANEL;rr(x,y,w,h,22);X.fill();
  X.strokeStyle=LINE;X.lineWidth=1.5;rr(x,y,w,h,22);X.stroke();
  if(heading){X.font='700 34px '+SANS;X.fillStyle=MUTED;X.textAlign='left';X.textBaseline='alphabetic';X.fillText(heading,x+48,y+72);}}
function sticky(x,y,w,h,text,accent=CYAN,fs=27){
  X.fillStyle=PANEL2;rr(x,y,w,h,16);X.fill();
  X.strokeStyle=accent;X.lineWidth=2;rr(x,y,w,h,16);X.stroke();
  X.fillStyle=accent;rr(x+2,y+10,5,h-20,2.5);X.fill();
  X.font='600 '+fs+'px '+SANS;
  const ws=text.split(' ');let lines=[],l='';
  for(const wd of ws){const t2=l?l+' '+wd:wd;if(X.measureText(t2).width>w-56&&l){lines.push(l);l=wd;}else l=t2;}
  lines.push(l);
  const lh=fs*1.34,sy=y+h/2-(lines.length-1)*lh/2;
  X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';
  lines.forEach((ln,i)=>X.fillText(ln,x+w/2+3,sy+i*lh));}
function bulletsRv(x,y,items,times,size=30,gap=70){
  X.textAlign='left';X.textBaseline='middle';
  items.forEach((b,i)=>{const rt=times[i];const u=es((T/1000-rt)/0.55);if(u<=0)return;
    const fy=Math.sin(T/1000*0.55+i*0.7)*3;
    X.save();X.globalAlpha*=Math.min(1,u*1.25);const yy=y+i*gap+(1-bo(u))*18+fy;
    const fl=Math.max(0,1-(T/1000-rt)/0.8);
    if(fl>0){X.save();X.globalAlpha*=fl*0.4;X.fillStyle=LIME;rr(x-8,yy-size*0.78,X.measureText(b).width+70,size*1.55,9);X.fill();X.restore();}
    // check-chip icon
    const s=Math.min(1,u*1.3);
    X.save();X.translate(x+9,yy);X.scale(s,s);
    X.shadowColor='rgba(182,240,74,.5)';X.shadowBlur=10;X.fillStyle=LIME;rr(-14,-14,28,28,8);X.fill();X.shadowBlur=0;
    X.strokeStyle='#0c1608';X.lineWidth=3.5;X.lineCap='round';X.lineJoin='round';
    X.beginPath();X.moveTo(-6,0);X.lineTo(-1,6);X.lineTo(7,-6);X.stroke();X.restore();
    // text: first word accented
    X.font='600 '+size+'px '+SANS;X.textBaseline='middle';let cxp=x+42;
    const ws=b.split(' ');
    ws.forEach((w,wi)=>{X.fillStyle=wi===0?LIME:INK;X.fillText(w,cxp,yy);cxp+=X.measureText(w+' ').width;});
    X.restore();});}
function colCardRv(x,y,w,title,items,accent,t0,k0){
  const h=150+items.length*58;const u0=A(t0,k0);if(u0<=0)return;
  X.save();X.globalAlpha*=u0;
  X.fillStyle=PANEL;rr(x,y,w,h,20);X.fill();
  X.strokeStyle=accent;X.lineWidth=2;rr(x,y,w,h,20);X.stroke();
  X.fillStyle=accent;rr(x,y,w,76,20);X.fill();X.fillRect(x,y+58,w,18);
  X.fillStyle='#0c1014';X.font='800 34px '+SANS;X.textAlign='center';X.textBaseline='middle';X.fillText(title,x+w/2,y+40);
  X.restore();
  X.textAlign='left';
  const good=(accent===LIME);
  items.forEach((b,i)=>{const u=A(t0,k0+1+i*0.8);if(u<=0)return;
    X.save();X.globalAlpha*=Math.min(1,u*1.25);const yy=y+128+i*58+(1-bo(u))*14;
    const s=Math.min(1,u*1.3);
    X.save();X.translate(x+42,yy);X.scale(s,s);
    X.shadowColor='rgba('+(good?'182,240,74':'224,107,216')+',.5)';X.shadowBlur=9;
    X.fillStyle=accent;X.beginPath();X.arc(0,0,13,0,7);X.fill();X.shadowBlur=0;
    X.strokeStyle='#0c1014';X.lineWidth=3;X.lineCap='round';
    if(good){X.beginPath();X.moveTo(-6,0);X.lineTo(-1,5);X.lineTo(6,-6);X.stroke();}
    else{X.beginPath();X.moveTo(-5,-5);X.lineTo(5,5);X.moveTo(5,-5);X.lineTo(-5,5);X.stroke();}
    X.restore();
    X.font='500 31px '+SANS;X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';X.fillText(b,x+66,yy);X.restore();});}
function arrowDownRv(x,y1,y2,u){
  if(u<=0)return;const yy=y1+(y2-y1)*u;
  X.strokeStyle='rgba(234,242,248,.55)';X.lineWidth=4;X.lineCap='round';
  X.beginPath();X.moveTo(x,y1);X.lineTo(x,yy-14);X.stroke();
  if(u>0.9){X.fillStyle='rgba(234,242,248,.55)';
  X.beginPath();X.moveTo(x-11,y2-16);X.lineTo(x+11,y2-16);X.lineTo(x,y2);X.closePath();X.fill();}}
function route(pts){
  X.save();X.strokeStyle='rgba(182,240,74,.35)';X.lineWidth=4;X.setLineDash([2,20]);
  X.lineDashOffset=-(T/90)%22; X.lineCap='round';
  X.beginPath();X.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){const [x,y]=pts[i],[px,py]=pts[i-1];
    X.bezierCurveTo(px+(x-px)*0.5,py,x-(x-px)*0.5,y,x,y);}
  X.stroke();X.restore();}
/* cluster reveal anchors (s) + active windows for pulse */
const A0=0.2,B0=99.73,C0=162.53,D0=200.03;
const ACT=[[0,175,1],[175,287,2],[287,359,3],[359,999,4]]; // [from,to,cluster]
function pulseFor(cl){const t=T/1000;
  for(const [a,b,c] of ACT){if(c===cl&&t>=a&&t<b)return 0.5+0.5*Math.sin(T/420);}return 0;}
function drawWorld(){
  X.fillStyle=BG;X.fillRect(-3000,-2000,16000,9000);
  X.save();X.globalAlpha=0.045;X.strokeStyle='#8b98a8';X.lineWidth=1;
  for(let gx=-3000;gx<13000;gx+=160){X.beginPath();X.moveTo(gx,-2000);X.lineTo(gx,7000);X.stroke();}
  for(let gy=-2000;gy<7000;gy+=160){X.beginPath();X.moveTo(-3000,gy);X.lineTo(13000,gy);X.stroke();}
  X.restore();
  const orbs=[[1980,900,'182,240,74'],[4000,1400,'57,208,208'],[6400,1400,'224,107,216'],[8300,2100,'182,240,74']];
  orbs.forEach((o,i)=>{const ph=T/1000*0.06+i*2.1;const ox=o[0]+Math.sin(ph)*240,oy=o[1]+Math.cos(ph*0.8)*160;
    const g=X.createRadialGradient(ox,oy,0,ox,oy,760);g.addColorStop(0,`rgba(${o[2]},0.05)`);g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;X.fillRect(ox-760,oy-760,1520,1520);});
  route([[1980,760],[3800,530],[6400,830],[8300,2160]]);
  /* A */
  grp(A(A0),()=>badgeDot(1980,760,1,pulseFor(1)));
  // Title: dramatic scale-in pop + sweep
  {const tu=A(A0,0.4);if(tu>0){X.save();const sc=0.9+0.1*bo(tu);X.globalAlpha*=Math.min(1,tu*1.35);
    X.translate(1400,860);X.scale(sc,sc);X.translate(-1400,-860);
    chapterCard(1400,860,'WHAT IS TRADING, ACTUALLY?',1060,pulseFor(1));
    // one-time light sweep across the title as it lands
    if(tu<1){const sw=tu;X.save();rr(870,700,1060,320,28);X.clip();
      const gx=870+1060*sw*1.2;const gr=X.createLinearGradient(gx-140,0,gx+140,0);
      gr.addColorStop(0,'rgba(182,240,74,0)');gr.addColorStop(0.5,'rgba(182,240,74,0.28)');gr.addColorStop(1,'rgba(182,240,74,0)');
      X.fillStyle=gr;X.fillRect(700,700,1400,320);X.restore();}
    X.restore();}}
  // Definition panel + sticky reveal as the camera zooms in (~"here's the definition")
  grp(A(33.8,0),()=>slideCard(780,1120,1240,560,'Definition of Trading'));
  grp(A(35.2,0),()=>sticky(846,1230,430,380,'Trading is the active buying and selling of financial instruments — stocks, indices, commodities or currencies — with the goal of profiting from short- or long-term price movements.',CYAN,25));
  // Bullets reveal one-by-one on the narration sentence starts (43–70s hold)
  bulletsRv(1350,1282,['Buying & selling financial instruments','Goal: profit from price movements','Trading ≠ investing','Trade long & short','Markets move every single day'],[43.2,50.6,54.6,63.1,69.4]);
  /* B */
  grp(A(B0),()=>badgeDot(3800,530,2,pulseFor(2)));
  grp(A(B0,0.5),()=>chapterCard(3800,760,'WHY I CHOSE TRADING',1280,pulseFor(2)));
  grp(A(B0,1.2),()=>slideCard(2950,1030,1700,600,''));
  const bx=[3280,3800,4320],bt=['Freedom','Scalability','Performance'];
  const bl=[['Location-independent','Time-independent'],['No employees','No inventory','No customer support'],['Results count —','not hours worked']];
  bt.forEach((tt,i)=>{
    grp(A(B0,1.8+i*0.7),()=>sticky(bx[i]-190,1110,380,150,tt,CYAN,34));
    arrowDownRv(bx[i],1280,1400,A(B0,2.6+i*0.7));
    X.textAlign='center';X.textBaseline='middle';
    bl[i].forEach((line,k)=>{const u=A(B0,3.2+i*0.7+k*0.4);if(u<=0)return;
      X.save();X.globalAlpha*=u;X.font='600 31px '+SANS;X.fillStyle=INK;X.fillText(line,bx[i],1450+k*54+(1-u)*12);X.restore();});
  });
  grp(A(B0+72,0),()=>{ // closing bar reveals when narration reaches it (~247s => B0+79? use 246)
  });
  grp(A(144.76,0),()=>{
    X.save();X.shadowColor='rgba(182,240,74,.25)';X.shadowBlur=40;
    X.fillStyle=PANEL2;rr(3020,1700,1560,220,18);X.fill();X.restore();
    X.strokeStyle='rgba(182,240,74,.55)';X.lineWidth=2;rr(3020,1700,1560,220,18);X.stroke();
    X.font='800 44px '+SANS;X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';
    X.fillText('Trading offers maximum freedom',3800,1775);
    X.fillText('— with full personal responsibility.',3800,1843);
  });
  /* C */
  grp(A(C0),()=>badgeDot(6400,830,3,pulseFor(3)));
  grp(A(C0,0.5),()=>chapterCard(6400,1060,'TRADING VS CLASSIC BUSINESS',1240,pulseFor(3)));
  colCardRv(5540,1330,780,'TRADING',['Minimal start-up costs','No employees','No products','No office','Works worldwide'],LIME,C0,1.4);
  grp(A(C0,2),()=>{const p=1+0.06*Math.sin(T/380);X.save();X.translate(6400,1560);X.scale(p,p);
    X.shadowColor='rgba(182,240,74,.35)';X.shadowBlur=30;X.font='900 100px '+SANS;X.fillStyle='#c8d0d8';X.textAlign='center';X.textBaseline='middle';X.fillText('VS',0,0);X.restore();});
  colCardRv(6480,1330,780,'CLASSIC BUSINESS',['High fixed costs','Managing employees','Customer management','Bureaucracy','Years of build-up'],MAGB,182.57,0.3);
  /* D */
  grp(A(D0),()=>badgeDot(8300,2160,4,pulseFor(4)));
  grp(A(D0,0.8),()=>{
    X.save();X.shadowColor='rgba(182,240,74,.3)';X.shadowBlur=70;
    X.fillStyle=PANEL;rr(7400,2300,1800,460,26);X.fill();X.restore();
    X.strokeStyle='rgba(182,240,74,.6)';X.lineWidth=3;rr(7400,2300,1800,460,26);X.stroke();
    X.font='700 24px ui-monospace,monospace';X.fillStyle=LIME;X.textAlign='center';X.textBaseline='middle';
    X.fillText('● BOTTOM LINE',8300,2372);});
  ['Trading is one of the most','capital-efficient business','models in the world.'].forEach((ln,i)=>{
    const u=A(207.4,0.4+i*0.8);if(u<=0)return;
    X.save();X.globalAlpha*=u;X.font='900 62px '+SANS;X.fillStyle=i===1?LIME:INK;X.textAlign='center';X.textBaseline='middle';
    X.fillText(ln,8300,2470+i*78+(1-bo(u))*14);X.restore();});
    {const uu=A(207.4,3.0);if(uu>0){const w=760*es(Math.min(1,uu));X.save();X.strokeStyle=LIME;X.lineWidth=5;X.lineCap='round';X.shadowColor='rgba(182,240,74,.7)';X.shadowBlur=12;X.beginPath();X.moveTo(8300-w/2,2650);X.lineTo(8300+w/2,2650);X.stroke();X.restore();}}
}
/* camera (unchanged measured timeline) */
const HOLDVIEW=[
  {a:0.0,b:35.39,v:{x:1500,y:1140,z:0.56}},
  {a:37.19,b:41.54,v:{x:1400,y:1240,z:0.86}},
  {a:43.34,b:75.46,v:{x:1420,y:1230,z:0.8}},
  {a:77.26,b:99.53,v:{x:1400,y:1300,z:0.72}},
  {a:101.33,b:109.37,v:{x:3800,y:1050,z:0.6}},
  {a:111.17,b:120.09,v:{x:3800,y:1055,z:0.78}},
  {a:121.89,b:143.46,v:{x:3800,y:1080,z:0.85}},
  {a:145.26,b:162.33,v:{x:3800,y:1198,z:0.72}},
  {a:164.13,b:169.68,v:{x:6400,y:1360,z:0.56}},
  {a:171.48,b:181.27,v:{x:6400,y:1290,z:0.74}},
  {a:183.07,b:199.83,v:{x:6400,y:1300,z:0.8}},
  {a:201.63,b:205.9,v:{x:8470,y:2420,z:0.8}},
  {a:207.7,b:225.43,v:{x:8300,y:2480,z:0.8}}
];
function camAt(tms){const t=tms/1000;
  if(t<=HOLDVIEW[0].b)return HOLDVIEW[0].v;
  for(let i=0;i<HOLDVIEW.length;i++){const h=HOLDVIEW[i];
    if(t>=h.a&&t<=h.b)return h.v;
    if(i<HOLDVIEW.length-1){const n=HOLDVIEW[i+1];
      if(t>h.b&&t<n.a){const u=es((t-h.b)/(n.a-h.b));
        return {x:h.v.x+(n.v.x-h.v.x)*u,y:h.v.y+(n.v.y-h.v.y)*u,z:h.v.z+(n.v.z-h.v.z)*u};}}}
  return HOLDVIEW[HOLDVIEW.length-1].v;}
function renderAt(t){
  T=t;const c=camAt(t);
  X.setTransform(1,0,0,1,0,0);X.fillStyle=BG;X.fillRect(0,0,1920,1080);
  X.setTransform(c.z,0,0,c.z,960-c.x*c.z,540-c.y*c.z);
  drawWorld();
  X.setTransform(1,0,0,1,0,0);
}
window.renderAt=renderAt;window.__ready=true;renderAt(0);
</script></body></html>
