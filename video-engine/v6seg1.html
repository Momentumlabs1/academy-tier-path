const BG='#070a10',INK='#eaf2f8',MUT='#8b98a8',LIME='#b6f04a',CYAN='#39d0d0',MAG='#e06bd8',RED='#ff5470',GOLD='#ffcf5c';

const SANS='system-ui,-apple-system,"Trebuchet MS",Roboto,sans-serif';
const clamp=(u,a,b)=>u<a?a:u>b?b:u;
const es=u=>{u=clamp(u,0,1);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const eo=u=>{u=clamp(u,0,1);return 1-Math.pow(1-u,3);};
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
function rr(x,y,w,h,r){x=P(x);y=P(y);w=P(w);h=P(h);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}

// discrete quote flash: each row ticks at a few scheduled times, fades over ~0.5s,
// and is EXACTLY 0 between ticks (holds are byte-static — anti-jitter).
const TICKS=[ // row → array of tick onset times (s)
 [1.2,4.8,9.6,14.1,19.8,24.6],[2.1,6.9,12.3,17.7,23.1],[0.9,5.4,11.1,16.8,22.2,26.1],
 [3.3,8.1,13.5,18.9,25.2],[1.8,7.2,13.2,20.1,25.8],[2.7,9.0,15.9,21.9],
 [4.2,10.5,17.1,23.7],[3.9,11.7,19.2,26.4],[1.5,6.3,12.9,18.3,24.0]];
function flashA(row){
  const ts=TICKS[row]||[];let best=0;
  for(const t0 of ts){const dt=T-t0;if(dt>=0&&dt<0.5){const a=1-dt/0.5;if(a>best)best=a;}}
  return best;
}

// ---------- DAX intraday area chart (silhouette recreation) ----------
const DAXPTS=[0.42,0.55,0.70,0.86,0.78,0.64,0.72,0.60,0.48,0.40,0.52,0.44,0.33,0.26,0.30,0.22,0.15,0.24,0.19,0.34,0.44];
function daxChart(x,y,w,h,rvl){
  const n=DAXPTS.length, dx=w/(n-1);
  const px=i=>x+i*dx, py=i=>y+h-(DAXPTS[i]*h*0.80)-h*0.10;
  const upto=clamp(rvl*(n-1),0,n-1), full=Math.floor(upto), f=upto-full;
  const lastX=full<n-1?px(full)+dx*f:px(n-1);
  const lastY=full<n-1?py(full)+(py(full+1)-py(full))*f:py(n-1);
  X.beginPath();X.moveTo(px(0),py(0));
  for(let i=1;i<=full;i++)X.lineTo(px(i),py(i));
  if(full<n-1)X.lineTo(lastX,lastY);
  X.lineTo(lastX,y+h);X.lineTo(px(0),y+h);X.closePath();
  const g=X.createLinearGradient(0,y,0,y+h);g.addColorStop(0,hexA('#f23645',0.20));g.addColorStop(1,hexA('#f23645',0.015));X.fillStyle=g;X.fill();
  X.beginPath();X.moveTo(px(0),py(0));
  for(let i=1;i<=full;i++)X.lineTo(px(i),py(i));
  if(full<n-1)X.lineTo(lastX,lastY);
  X.strokeStyle=TVDN;X.lineWidth=2.5;X.lineJoin='round';X.stroke();
  // live dot at leading edge
  X.fillStyle=TVDN;X.beginPath();X.arc(lastX,lastY,4,0,7);X.fill();
  X.fillStyle=TVSUB;X.font='400 15px '+SANS;X.textAlign='center';X.textBaseline='alphabetic';
  const labels=['10','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
  for(let i=0;i<labels.length;i++)X.fillText(labels[i],x+(i/(labels.length-1))*w,y+h+26);
}

}

// ---------- brand overlays (lower-thirds, bottom-CENTER; bottom-left reserved for COSMO) ----------
function ltPill(bx,by,bw,bh,edge){X.fillStyle=hexA('#070a10',0.86);rr(bx,by,bw,bh,14);X.fill();X.strokeStyle=hexA(edge,0.65);X.lineWidth=2;rr(bx,by,bw,bh,14);X.stroke();}
function kicker(){const a=rv(0.2,0.6)*(1-clamp((T-6.5)/0.8,0,1));if(a<=0)return;
  const bw=560,bh=58,bx=(W-bw)/2,by=H-96;X.save();X.globalAlpha=a;ltPill(bx,by,bw,bh,MAG);
  X.fillStyle=MAG;X.font='800 20px '+SANS;X.textAlign='center';X.textBaseline='middle';
  X.fillText('● LESSON · VOLUME PROFILE  +  LEVEL 2',W/2,by+bh/2);X.restore();}
function wayChip(){ // "The first is TradingView" 18.35s → hold through 99% then cross-fade to limit
  const a=rv(17.9,0.5)*(1-clamp((T-24.3)/0.4,0,1));if(a<=0)return;
  const bw=560,bh=64,bx=(W-bw)/2,by=H-100;X.save();X.globalAlpha=a;ltPill(bx,by,bw,bh,CYAN);
  X.fillStyle=CYAN;X.font='800 18px '+SANS;X.textAlign='left';X.textBaseline='middle';X.fillText('WAY 1',bx+24,by+bh/2);
  X.fillStyle=INK;X.font='800 26px '+SANS;X.fillText('TradingView',bx+118,by+bh/2-2);
  const cc=clamp((T-20.0)/1.4,0,1);if(cc>0){X.fillStyle=CYAN;X.font='900 30px '+SANS;X.textAlign='right';
    X.fillText(Math.round(99*eo(cc))+'%',bx+bw-24,by+bh/2-2);
    X.fillStyle=MUT;X.font='600 13px '+SANS;X.fillText('of traders',bx+bw-24,by+bh/2+18);}
  X.restore();}
function limitCallout(){ // "Level 2 data is limited" 24.6s
  const a=clamp((T-24.5)/0.4,0,1);if(a<=0)return;
  const bw=640,bh=64,bx=(W-bw)/2,by=H-100;X.save();X.globalAlpha=a;
  X.fillStyle=hexA('#1a0c12',0.92);rr(bx,by,bw,bh,14);X.fill();X.strokeStyle=hexA(RED,0.75);X.lineWidth=2;rr(bx,by,bw,bh,14);X.stroke();
  X.save();X.translate(bx+38,by+bh/2);X.fillStyle=RED;X.beginPath();X.arc(0,0,15,0,7);X.fill();
  X.strokeStyle='#1a0c12';X.lineWidth=3;X.lineCap='round';X.beginPath();X.moveTo(-6,-6);X.lineTo(6,6);X.moveTo(6,-6);X.lineTo(-6,6);X.stroke();X.restore();
  X.fillStyle=RED;X.font='800 24px '+SANS;X.textAlign='left';X.textBaseline='middle';X.fillText('Level 2 data on TradingView: limited',bx+70,by+bh/2-1);
  X.restore();}

// ---------- cursor scenario — beat-locked to VO onsets (ms) ----------
const WLrow=i=>[WL.x+150, WL.y+82+i*32+16];
const cur=IFE.Cursor([
  {at:600},
  {at:2600, move:WLrow(2), W:300},                       // "Level 2 data" 3.9s → watchlist (lands ~3.2s, hovers XAUUSD)
  {at:5200, move:WLrow(5), W:260},                       // "volume profile" 5.6s → scan down
  {at:8300, move:[DAX.x+680,DAX.y+360], W:520},          // "combination/live" 8.6–12s → into DAX chart
  {at:15200, move:[DAX.x+980,DAX.y+300], W:400},         // "two ways" 15.8s → drift toward nav
  {at:17700, move:[NAVITEMS[3].x+28,NAV.y0+NAV.h/2], W:110}, // "The first is TradingView" 18.35s → Broker
  {click:true},                                          // opens dropdown ~18.5s
  {at:23400, move:[WL.x+250, WL.y+82+2*32+16], W:260},   // "access to Level 2 limited" 24.8s → watchlist
], {start:[300,1000], seed:60021, os:'win', t0:0});
// dropdown envelope keyed to the same VO timeline (open ~18.5s, close ~24.0s)
function dropAt(ms){const o=clamp((ms/1000-18.5)/0.32,0,1), c=1-clamp((ms/1000-24.0)/0.4,0,1);return Math.max(0,Math.min(o,c));}

function renderAt(ms){T=ms/1000;const s=cur.sample(ms);
  browserChrome();
  const drop=dropAt(ms);
  marketBody(s, clamp((T-0.3)/2.2,0,1));
  tvNav(s, drop);
  brokerDropdown(drop);
  taskbar();
  const inNav=s.y>=NAV.y0+12&&s.y<=NAV.y0+52&&s.x>=480&&s.x<=1180;
  const inWL=s.x>=WL.x&&s.x<=WL.x+WL.w&&s.y>=WL.y+82&&s.y<=WL.y+WL.h;
  const shape=(inNav||inWL)?'pointer':'default';
  IFE.drawCursor(X,s.x,s.y,shape,s.pressed,cur.os);
  kicker();wayChip();limitCallout();
}
window.renderAt=renderAt;window.__ready=true;window.__dur=28.0;renderAt(0);
