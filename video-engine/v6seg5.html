<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0d13}canvas{position:absolute;left:0;top:0}</style>
<script src="interface-engine.js"></script>
<script src="tvchrome.js"></script>
<script src=".render/v6/vo/s6.words.js"></script>
</head><body><canvas id="cv" width="1920" height="1080"></canvas><script>
// ============ SEGMENT 5 — Wrap-up (S6): TV line chart + zones → brand outro ============
const X=document.getElementById('cv').getContext('2d');const W=1920,H=1080;const P=Math.round;let T=0;
const {C,SANS,TV,TASK}=TVC;const clamp=TVC.clamp,eo=TVC.eo,es=TVC.es,hexA=TVC.hexA,rr=TVC.rr;
const INK='#eaf2f8',MUT='#8b98a8',LIME='#b6f04a',CYAN='#39d0d0',MAG='#e06bd8',RED='#ff5470',GOLD='#ffcf5c',GRN='#33e08a';

const GAPS=[{at:13.9,dur:3.2}];  // zero-drawdown runs play
const tm=TVC.mkTimeMap(GAPS);
const sT=vo=>tm.sceneT(vo);
const gS=at=>{let s=at;for(const g of GAPS)if(g.at<at)s+=g.dur;return s;};
const OUTRO=sT(33.6);                 // crossfade to brand card
const DUR=Math.ceil((sT(VOW_S6.dur)+12.0)*10)/10;  // hold outro ≈ 51.2

// ---- chart (line, XAUUSD 1m — mirrors his wrap-up ~41–44min) ----
const CH={x0:TV.rail.w+1,x1:1920-TV.scaleW,y0:126,y1:912};
const PMIN=4052,PMAX=4096;
const NARR=[[0,4060],[14,4070],[24,4066],[34,4079],[44,4074],[54,4086],[64,4081],[74,4090],[84,4085],[95,4091],[109,4088]];
const N=110, SER=TVC.mkSeries(N,NARR,77990,1.3);
const CWc=(CH.x1-CH.x0-60)/N;
const xOf=i=>CH.x0+30+i*CWc+CWc/2;
let yOf=null;

// two momentum trades (zero drawdown): entries at i=26 (long 4067→4079) and i=64 (long 4081→4090)
const TRD=[{i:26,e:4067.2,t:4079,l:34},{i:64,e:4081.4,t:4090,l:74}];

function ltPill(bx,by,bw,bh,edge){X.fillStyle=hexA('#070a10',0.86);rr(X,bx,by,bw,bh,14);X.fill();X.strokeStyle=hexA(edge,0.65);X.lineWidth=2;rr(X,bx,by,bw,bh,14);X.stroke();X.lineWidth=1;}
function lower(t0,t1,edge,label,sub){
  const a=es(clamp((T-t0)/0.5,0,1))*(1-clamp((T-t1)/0.4,0,1));if(a<=0)return;
  X.save();X.globalAlpha=a;
  X.font='800 20px '+SANS;const w=Math.max(X.measureText(label).width+70,sub?X.measureText(sub).width+70:0);
  const bw=Math.max(430,w),bh=sub?66:56,bx=(W-bw)/2,by=H-100;
  ltPill(bx,by,bw,bh,edge);
  X.fillStyle=edge;X.beginPath();X.arc(bx+30,by+bh/2,5,0,7);X.fill();
  X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';X.font='800 20px '+SANS;
  X.fillText(label,bx+52,by+(sub?24:bh/2));
  if(sub){X.fillStyle=MUT;X.font='600 13px '+SANS;X.fillText(sub,bx+52,by+47);}
  X.restore();
}

const ms=vo=>sT(vo)*1000;
const yPix=p=>CH.y1-(p-PMIN)/(PMAX-PMIN)*(CH.y1-CH.y0);
const cur=IFE.Cursor([
  {shape:'crosshair'},
  {at:900, move:[xOf(40),yPix(4076)], W:240},
  {at:ms(9.4), move:[xOf(26),yPix(4067.6)], W:40},     // first trade
  {at:ms(14.0), move:[xOf(34),yPix(4079)], W:60},      // run 1
  {at:gS(13.9)*1000+1100, move:[xOf(64),yPix(4081.8)], W:40},
  {at:gS(13.9)*1000+1900, move:[xOf(74),yPix(4090)], W:60},
  {at:ms(19.5), move:[xOf(88),yPix(4082)], W:120},     // VP overlay
  {at:ms(28.3), move:[xOf(60),yPix(4086)], W:200},
], {start:[820,480], seed:99506, os:'win', t0:0});

const sA=()=>Math.min(clamp(T/0.35,0,1),1-clamp((T-(DUR-0.4))/0.4,0,1));

// outro helpers
function outroCard(a){
  if(a<=0)return;
  X.save();X.globalAlpha=a;
  X.fillStyle='#070a10';X.fillRect(0,0,W,H);
  // drifting grid (meaningful, subtle — no orbs)
  X.strokeStyle='rgba(57,208,208,0.05)';X.lineWidth=1;
  const off=(T*12)%64;
  for(let x=-64+off;x<W+64;x+=64){X.beginPath();X.moveTo(x,0);X.lineTo(x-40,H);X.stroke();}
  for(let y=0;y<H;y+=64){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();}
  // kinetic title
  const t0=OUTRO+0.25;
  const words=['VOLUME','PROFILE'];
  X.textAlign='center';X.textBaseline='alphabetic';
  for(let i=0;i<2;i++){
    const wa=es(clamp((T-t0-i*0.14)/0.5,0,1));
    if(wa<=0)continue;
    X.save();X.globalAlpha=a*wa;
    X.font='900 110px '+SANS;
    X.shadowColor=hexA(LIME,0.55);X.shadowBlur=34*wa;
    X.fillStyle=INK;
    X.fillText(words[i],960,400+i*118);
    X.restore();
  }
  // underline sweep
  const ua=es(clamp((T-t0-0.5)/0.5,0,1));
  if(ua>0){X.fillStyle=LIME;X.fillRect(960-320*ua,540,640*ua,6);}
  X.fillStyle=MUT;X.font='700 26px '+SANS;X.textAlign='center';
  const sa2=clamp((T-t0-0.7)/0.5,0,1);
  X.save();X.globalAlpha=a*sa2;
  X.fillText('VALUE AREA · HVN & LVN — LIVE',960,596);X.restore();
  // chips row
  const chips=['VOLUME PROFILE','VALUE AREA','POC','ABSORPTION','FOOTPRINT'];
  X.font='700 17px '+SANS;
  let cwSum=0;const pads=34;const ws=chips.map(c=>X.measureText(c).width+pads);
  ws.forEach(w2=>cwSum+=w2+14);
  let cx=960-cwSum/2;
  chips.forEach((c2,i)=>{
    const ca=es(clamp((T-t0-1.0-i*0.12)/0.4,0,1));
    const w2=ws[i];
    if(ca>0){X.save();X.globalAlpha=a*ca;
      X.fillStyle=hexA('#0d1420',0.9);rr(X,cx,668,w2,46,23);X.fill();
      X.strokeStyle=hexA([LIME,CYAN,RED,MAG,GOLD][i],0.7);X.lineWidth=2;rr(X,cx,668,w2,46,23);X.stroke();X.lineWidth=1;
      X.fillStyle=INK;X.textAlign='center';X.textBaseline='middle';X.fillText(c2,cx+w2/2,692);
      X.restore();}
    cx+=w2+14;
  });
  // academy line + next card
  const na=es(clamp((T-t0-1.9)/0.6,0,1));
  if(na>0){X.save();X.globalAlpha=a*na;
    X.fillStyle=CYAN;X.font='800 20px '+SANS;X.textAlign='center';X.textBaseline='alphabetic';
    X.fillText('COSMOS CANDLES ACADEMY',960,796);
    X.fillStyle=hexA('#0d1420',0.9);rr(X,760,826,400,74,14);X.fill();
    X.strokeStyle=hexA(LIME,0.5);rr(X,760,826,400,74,14);X.stroke();
    X.fillStyle=MUT;X.font='600 13px '+SANS;X.fillText('NEXT LESSON',960,856);
    X.fillStyle=INK;X.font='800 19px '+SANS;X.fillText('Orderflow Mastery — Elite',960,882);
    X.restore();}
  X.restore();
}

function renderAt(msIn){
  T=msIn/1000;const s=cur.sample(msIn);
  const outA=es(clamp((T-OUTRO)/0.7,0,1));
  // ---------- TV wrap chart ----------
  if(outA<1){
    TVC.browserChrome(X,{});
    TVC.tvToolbar(X,{symbol:'XAUUSD',interval:'1m',replay:true});
    X.fillStyle='#fff';X.fillRect(0,TV.tool.y0+TV.tool.h+1,W,TASK.y0-(TV.tool.y0+TV.tool.h+1));
    yOf=TVC.priceScale(X,{y0:CH.y0,y1:CH.y1,pmin:PMIN,pmax:PMAX,step:2.5,dec:3,x0:CH.x0});
    TVC.tvWatermark(X,{sym:'XAUUSD',int:'1',name:'Gold Spot / U.S. Dollar',replay:true});
    const rev=clamp((T-0.1)/1.4,0,1)*N;
    // line chart + soft area
    X.strokeStyle=C.tvBlue;X.lineWidth=2;X.beginPath();
    for(let i=0;i<Math.min(N,rev);i++){const x=xOf(i),y=yOf(SER[i].c);i?X.lineTo(x,y):X.moveTo(x,y);}
    X.stroke();
    X.save();X.globalAlpha=0.08;X.lineTo(xOf(Math.min(N,rev)-1),CH.y1);X.lineTo(xOf(0),CH.y1);X.closePath();X.fillStyle=C.tvBlue;X.fill();X.restore();X.lineWidth=1;
    // supply/demand zones (his drawn boxes)
    const zA=clamp((T-1.0)/0.8,0,1);
    if(zA>0){
      X.save();X.globalAlpha=zA;
      X.fillStyle='rgba(8,153,129,0.10)';X.fillRect(xOf(18),yOf(4068.5),xOf(52)-xOf(18),yOf(4063.5)-yOf(4068.5));
      X.strokeStyle='rgba(8,153,129,0.7)';X.setLineDash([5,4]);X.strokeRect(P(xOf(18))+0.5,P(yOf(4068.5))+0.5,P(xOf(52)-xOf(18)),P(yOf(4063.5)-yOf(4068.5)));
      X.fillStyle='rgba(242,54,69,0.09)';X.fillRect(xOf(46),yOf(4092.5),xOf(96)-xOf(46),yOf(4087.5)-yOf(4092.5));
      X.strokeStyle='rgba(242,54,69,0.7)';X.strokeRect(P(xOf(46))+0.5,P(yOf(4092.5))+0.5,P(xOf(96)-xOf(46)),P(yOf(4087.5)-yOf(4092.5)));
      X.setLineDash([]);X.restore();
    }
    // momentum trades (zero drawdown)
    for(let k=0;k<TRD.length;k++){
      const tr=TRD[k];
      const tOn=k===0?sT(9.6):gS(13.9)+1.0;
      const a=clamp((T-tOn)/0.5,0,1);if(a<=0)continue;
      const run=es(clamp((T-tOn-0.3)/1.2,0,1));
      X.save();X.globalAlpha=a;
      // entry marker
      X.fillStyle='#089981';X.beginPath();X.moveTo(xOf(tr.i),yOf(tr.e)+18);X.lineTo(xOf(tr.i)-9,yOf(tr.e)+32);X.lineTo(xOf(tr.i)+9,yOf(tr.e)+32);X.closePath();X.fill();
      X.font='700 12px '+SANS;X.textAlign='center';X.textBaseline='middle';
      X.fillStyle='#089981';X.fillText('LONG',xOf(tr.i),yOf(tr.e)+44);
      // run arrow along the line
      if(run>0){
        X.strokeStyle=GRN;X.lineWidth=3.4;X.lineCap='round';
        X.beginPath();
        const iEnd=tr.i+(tr.l-tr.i)*run;
        for(let i=tr.i;i<=iEnd;i++){const x=xOf(i),y=yOf(SER[i].c)-10;i===tr.i?X.moveTo(x,y):X.lineTo(x,y);}
        X.stroke();X.lineWidth=1;
        if(run>0.95){
          X.fillStyle=GRN;rr(X,xOf(tr.l)-74,yOf(tr.t)-46,148,28,6);X.fill();
          X.fillStyle='#06251a';X.font='800 13px '+SANS;X.fillText('≈ 0 DRAWDOWN',xOf(tr.l),yOf(tr.t)-32);
        }
      }
      X.restore();
    }
    // small VP overlay when he says "add the volume profile" (19.5–27.5)
    {const a=Math.min(clamp((T-sT(19.6))/0.6,0,1),1-clamp((T-sT(27.6))/0.8,0,1));
     if(a>0){X.save();X.globalAlpha=a*0.9;
       const px=xOf(96),pw=150;
       for(let r=0;r<26;r++){
         const p=4076+r*0.62;
         const v=Math.abs(IFE.noise1D(r*0.33,1,4321))+0.15;
         X.fillStyle=r===9?hexA(C.tvDn,0.8):'rgba(41,98,255,0.30)';
         X.fillRect(px,yOf(p)-3,-v*pw,6);
       }
       X.restore();}}
    // furniture
    TVC.tvLegend(X,{name:'Gold Spot / U.S. Dollar',int:'1',src:'OANDA',o:'4.088,915',h:'4.091,205',l:'4.088,130',c:'4.089,830',chg:'+1,915 (+0,05%)',up:true,sell:'4.090,070',buy:'4.090,070'});
    TVC.cvdRow(X,{y:CH.y1+16,vals:[['316',0],['507',0],['316',0],['507',0]]});
    TVC.timeAxis(X,{y:CH.y1+30,labels:[[300,'05:30'],[560,'06:00'],[820,'06:30'],[1080,'07:00'],[1340,'07:30'],[1600,'08:00']]});
    TVC.replayToolbar(X,{y:946,playing:false,speed:'10x',int:'1m'});
    TVC.replayInfoBar(X);
    TVC.tvBottomRow(X,{clockUTC:'21:44:'+String(P(10+T)%60).padStart(2,'0')});
    TVC.tvLeftRail(X,{});
    TVC.tvFloatBar(X,{});
    const onChart=s.x>CH.x0&&s.x<CH.x1&&s.y>CH.y0&&s.y<CH.y1;
    if(onChart&&s.shape==='crosshair'){
      X.save();X.strokeStyle='rgba(120,134,150,0.65)';X.setLineDash([4,4]);
      X.beginPath();X.moveTo(CH.x0,P(s.y)+0.5);X.lineTo(CH.x1,P(s.y)+0.5);
      X.moveTo(P(s.x)+0.5,CH.y0);X.lineTo(P(s.x)+0.5,CH.y1);X.stroke();X.setLineDash([]);X.restore();
      const pv=PMIN+(1-(s.y-CH.y0)/(CH.y1-CH.y0))*(PMAX-PMIN);
      TVC.priceTag(X,pv,yOf,TVC.fmtDE(pv,3),'#2a2e39');
    }
    TVC.priceTag(X,SER[Math.min(N-1,Math.floor(rev))-1<0?0:Math.min(N-1,Math.floor(rev)-1)].c,yOf,TVC.fmtDE(SER[Math.max(0,Math.min(N-1,Math.floor(rev)-1))].c,3),C.tvBlue);
    TVC.winTaskbar(X,{clock:'23:24',date:'12.07.2026',weather:['Feels hotter','Now']});
    IFE.drawCursor(X,s.x,s.y,onChart?'crosshair':'default',s.pressed,cur.os);
    // lower thirds
    lower(0.4,sT(7.6),LIME,'SIMPLE.','volume profile + a few confirmations = momentum');
    lower(sT(9.35),sT(17.2),GRN,'INSTANT LOSS — OR ZERO DRAWDOWN','you know within two minutes');
    lower(sT(17.5),sT(23.2),CYAN,'ALREADY TRADING?','add the volume profile — sharpen your edge');
    lower(sT(28.1),sT(32.2),GOLD,'WORLD-CHAMPION SYSTEMS','traded for years');
  }
  // ---------- outro ----------
  outroCard(outA);
  const a=sA();
  if(a<1){X.fillStyle='rgba(7,10,16,'+(1-a)+')';X.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;window.__ready=true;window.__dur=DUR;renderAt(0);
</script></body></html>
