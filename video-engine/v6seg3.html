// ---- replay reveal (visible candle count as f(sceneT)) ----
function revealAt(t){
  const k=[[0,52],[gS(41.60),52],[gS(41.60)+4.0,58],[sT(58.0),58],[sT(71.0),82],[sT(74.9),86],[gS(84.0),104],[gS(84.0)+1.6,106],[sT(86.0),107],[gS(115.30),107],[gS(115.30)+9.4,126],[DUR,126]];
  for(let i=0;i<k.length-1;i++)if(t>=k[i][0]&&t<=k[i+1][0]){
    const u=(t-k[i][0])/Math.max(0.001,k[i+1][0]-k[i][0]);
    return k[i][1]+(k[i+1][1]-k[i][1])*u;
  }
  return 126;
}

// ---- volume histogram from visible candles (REAL VP mechanics) ----
const hCache={};
function histo(i0,i1){
  const key=i0+'_'+i1;
  if(hCache[key])return hCache[key];
  const nb=44, lo=PMIN+1, hi=PMAX-1, bh=(hi-lo)/nb;
  const rows=new Array(nb).fill(0);
  for(let i=i0;i<=i1;i++){const k=SER[i];
    const a=Math.max(lo,Math.min(k.l,k.o,k.c)), b=Math.min(hi,Math.max(k.h,k.o,k.c));
    const j0=Math.floor((a-lo)/bh), j1=Math.floor((b-lo)/bh);
    for(let j=Math.max(0,j0);j<=Math.min(nb-1,j1);j++)rows[j]+=k.v/(j1-j0+1);
  }
  let poc=0;for(let j=1;j<nb;j++)if(rows[j]>rows[poc])poc=j;
  const tot=rows.reduce((a,b)=>a+b,0);let acc=rows[poc],a2=poc,b2=poc;
  while(acc<tot*0.7&&(a2>0||b2<nb-1)){
    const dn=a2>0?rows[a2-1]:-1, up=b2<nb-1?rows[b2+1]:-1;
    if(up>=dn){b2++;acc+=rows[b2];}else{a2--;acc+=rows[a2];}
  }
  const out={rows:rows.map((v,j)=>({p:lo+(j+0.5)*bh,v})),bh,
    poc:lo+(poc+0.5)*bh,val:lo+(a2)*bh,vah:lo+(b2+1)*bh,max:rows[poc]};
  hCache[key]=out;return out;
}

// ---- VP display state ----
function vpState(t){
  // returns {i0,i1,drawFrac,alpha,handles} — VP1: low(24)→52 ; redraw: →58 ; cons: 86→104
  const t1=sT(11.1), t1e=sT(14.85)+3.0;               // draw 24→52
  const tR=sT(57.0), tRe=sT(57.0)+2.5;                // redraw →58
  if(t<t1)return null;
  if(t<tR){
    const f=clamp((t-t1)/(t1e-t1),0,1);
    return {i0:24,i1:52,drawFrac:f,alpha:1,handles:t<sT(30)};
  }
  const f=clamp((t-tR)/(tRe-tR),0,1);
  const i1=P(52+(58-52)*f);
  return {i0:24,i1,drawFrac:1,alpha:1,handles:f<1};
}

// ---- consolidation VP box (86..104) ----
function consState(t){
  const t0=sT(76.7), t1=sT(78.9);
  if(t<t0)return null;
  return {f:clamp((t-t0)/(t1-t0),0,1)};
}

// ---- scribbles (precomputed) ----

function drawScr(base,cx,cy,t0,dur,hold,col){

}

    X.fillStyle=ai?'#089981':(a2>100?'#bfe8d6':'#eaf7f1');X.fillRect(gx+cw+2,y,cw,rh-2);
    X.fillStyle=ai?'#fff':'#0a7a56';X.fillText(String(a2),gx+cw+2+cw/2,y+rh/2-1);

    X.strokeStyle='#089981';X.lineWidth=3;X.strokeRect(gx+cw+2,y61,cw,rh-2);X.lineWidth=1;
  }
  X.restore();

}

// ---- position tool state ----
const ENTRY=4069.2,STOP=4068.4,TGT1=4071.44,TGT2=4072.88;
function posState(t){
  const a=clamp((t-gS(111.5))/0.5,0,1);if(a<=0)return null;
  const ext=clamp((t-sT(117.9))/0.8,0,1);          // target 1:2.8 → 1:4.6
  const tgt=TGT1+(TGT2-TGT1)*es(ext);
  // open pnl follows reveal price
  const rev=Math.floor(revealAt(t));
  const px=SER[Math.max(0,Math.min(N-1,rev-1))].c;
  const pnl=Math.max(0,(px-ENTRY))*280;
  const rrv=(px-ENTRY)/(ENTRY-STOP);
  return {a,tgt,pnl,rrv:Math.max(0,rrv)};
}

// ---- lower thirds ----
function ltPill(bx,by,bw,bh,edge){X.fillStyle=hexA('#070a10',0.86);rr(X,bx,by,bw,bh,14);X.fill();X.strokeStyle=hexA(edge,0.65);X.lineWidth=2;rr(X,bx,by,bw,bh,14);X.stroke();X.lineWidth=1;}
function lower(t0,t1,edge,label,sub){
  const a=es(clamp((T-t0)/0.5,0,1))*(1-clamp((T-t1)/0.4,0,1));if(a<=0)return;
  X.save();X.globalAlpha=a;
  X.font='800 20px '+SANS;const w=Math.max(X.measureText(label).width+70,sub?X.measureText(sub).width+70:0);
  const bw=Math.max(430,w),bh=sub?66:56,bx=(W-bw)/2,by=H-100;
  ltPill(bx,by,bw,bh,edge);
  X.fillStyle=edge;X.beginPath();X.arc(bx+30,by+bh/2,5,0,7);X.fill();
  X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';X.font='800 20px '+SANS;
  X.fillText(label,bx+52,by+(sub?24:bh/2));
  if(sub){X.fillStyle=MUT;X.font='600 13px '+SANS;X.fillText(sub,bx+52,by+47);}
  X.restore();
}
