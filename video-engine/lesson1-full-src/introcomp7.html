<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
  #stage{position:relative;width:1920px;height:1080px;transform-origin:960px 540px;will-change:transform}
  #plate{position:absolute;inset:0;width:1920px;height:1080px}
  .clip{position:absolute;left:0;top:0;width:1920px;height:1080px}
  .scr{position:absolute;left:0;top:0;transform-origin:0 0;filter:brightness(.86) saturate(.92) contrast(.98)}
</style></head><body>
<div id="stage">
  <img id="plate" src="../hedra/plate_v5c_hq.png">
  <div id="clipL" class="clip"><img id="scrL" class="scr" width="1280" height="960"></div>
  <div id="clipR" class="clip"><img id="scrR" class="scr" width="1280" height="960"></div>
  <canvas id="fx" style="position:absolute;left:0;top:0" width="1920" height="1080"></canvas>
  <canvas id="glassC" style="position:absolute;left:0;top:0" width="1920" height="1080"></canvas>
  <img id="cosmo" style="position:absolute;left:520px;top:250px;width:1400px;height:788px">
</div>
<script>
const SX=1920/1376, SY=1080/768;
const sc=p=>[p[0]*SX,p[1]*SY];
{const Q={"L": {"corners": {"TL": [326, 278], "TR": [534, 294], "BR": [534, 407], "BL": [326, 419]}, "poly": [[326, 278], [336, 279], [346, 280], [356, 281], [366, 282], [376, 283], [386, 284], [396, 285], [406, 286], [416, 287], [426, 288], [436, 288], [446, 289], [456, 290], [466, 291], [476, 291], [486, 292], [496, 292], [506, 293], [516, 294], [526, 294], [534, 294], [534, 407], [524, 407], [514, 408], [504, 408], [494, 409], [484, 409], [474, 409], [464, 410], [454, 411], [444, 411], [434, 412], [424, 412], [414, 413], [404, 414], [394, 414], [384, 415], [374, 412], [364, 407], [354, 415], [344, 418], [334, 419], [326, 419]], "n": 26167}, "R": {"corners": {"TL": [543, 294], "TR": [750, 297], "BR": [750, 405], "BL": [543, 406]}, "poly": [[543, 294], [553, 295], [563, 295], [573, 296], [583, 296], [593, 296], [603, 296], [613, 297], [623, 297], [633, 297], [643, 297], [653, 298], [663, 298], [673, 298], [683, 298], [693, 298], [703, 298], [713, 297], [723, 297], [733, 297], [743, 297], [750, 297], [750, 405], [740, 405], [730, 405], [720, 405], [710, 405], [700, 405], [690, 405], [680, 405], [670, 405], [660, 405], [650, 405], [640, 405], [630, 405], [620, 405], [610, 405], [600, 405], [590, 405], [580, 406], [570, 406], [560, 406], [550, 406], [543, 406]], "n": 22760}};
  for(const side of ['L','R']){
    const c=Q[side].corners;
    const q=[c.TL,c.TR,c.BR,c.BL].map(sc);
    // homography unit-square -> quad
    const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q;
    const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2;
    const sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
    const den=dx1*dy2-dx2*dy1;
    const g=(sx*dy2-sy*dx2)/den, hh=(dx1*sy-dy1*sx)/den;
    const a=x1-x0+g*x1, b=x3-x0+hh*x3, cc=x0;
    const d=y1-y0+g*y1, e=y3-y0+hh*y3, f=y0;
    const w=1280,h=960;
    document.getElementById('scr'+side).style.transform=
      `matrix3d(${a/w},${d/w},0,${g/w},${b/h},${e/h},0,${hh/h},0,0,1,0,${cc},${f},0,1)`;
    // clip to the actual (curved) screen contour, slightly inset via pixel coords
    const poly=Q[side].poly.map(sc).map(p=>`${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(',');
    document.getElementById('clip'+side).style.clipPath=`polygon(${poly})`;
    // glass reflection
    const g2=document.getElementById('glassC').getContext('2d');
    g2.save();g2.beginPath();const pp=Q[side].poly.map(sc);
    g2.moveTo(pp[0][0],pp[0][1]);for(let i=1;i<pp.length;i++)g2.lineTo(pp[i][0],pp[i][1]);g2.closePath();g2.clip();
    const gr=g2.createLinearGradient(q[0][0],q[0][1],q[2][0],q[2][1]);
    gr.addColorStop(0,'rgba(255,255,255,0.09)');gr.addColorStop(0.35,'rgba(255,255,255,0.02)');gr.addColorStop(0.7,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.12)');
    g2.fillStyle=gr;g2.fillRect(0,0,1920,1080);g2.restore();
  }
  window.__ready=true;
}
window.setFrame=async(i)=>{
  const n=String(i).padStart(5,'0');
  const L=document.getElementById('scrL'),R=document.getElementById('scrR'),C=document.getElementById('cosmo');
  const cf=Math.min(362,Math.floor(i*25/30));
  L.src=`../ds2/f00000.png`;R.src=`../tv/f${String(Math.min(434,i)).padStart(5,'0')}.png`;C.src=`../cks_l1/c${String(cf).padStart(5,'0')}.png`;
  await Promise.all([L.decode(),R.decode(),C.decode()]);
  // camera: ease to 1.05 by 8s, ease back to 1.03 by 14.5s (matches old zoompan curve, subpixel-smooth)
  const z=(1+0.030*Math.min(i/240,1)-0.012*Math.max(0,Math.min((i-240)/290,1)))*1.34;
  // medium shot: world center (1235,430), frame bottom ~ waist height — floor never visible
  const cx=1120, cy=560;
  const st=document.getElementById('stage');
  st.style.transformOrigin='0 0';
  st.style.transform=`translate(${960-cx*z}px,${540-cy*z}px) scale(${z})`;
  drawFX(i);
  return true;
};

// --- liveliness layer: rain in window + LED breathing glow (deterministic per frame) ---
const WIN=[[0,14],[655,80],[655,800],[0,880]]; // window region 1920x1080 coords
function drawFX(i){
  const c=document.getElementById('fx').getContext('2d');
  c.clearRect(0,0,1920,1080);
  // rain: 90 streaks, deterministic pseudo-random, falling with slight slant
  c.save();c.beginPath();c.moveTo(WIN[0][0],WIN[0][1]);for(let k=1;k<4;k++)c.lineTo(WIN[k][0],WIN[k][1]);c.closePath();c.clip();
  c.strokeStyle='rgba(190,215,235,0.16)';c.lineWidth=1.4;
  for(let s=0;s<90;s++){
    const seed=s*97.13, spd=520+((s*37)%160), x0=((seed*13.7)%700)-20, len=26+(s*11)%22;
    const y=((i/30)*spd+seed*53)%(1000+len)-len;
    const x=x0+((i/30)*spd)*0.12;
    const xm=((x%720)+720)%720-20;
    c.beginPath();c.moveTo(xm,y);c.lineTo(xm+len*0.12,y+len);c.stroke();
  }
  c.restore();
  // LED breathing: warm glow pulse behind panels/desk (right side) + subtle RGB shift on PC region
  const puls=0.5+0.5*Math.sin(i/30*2*Math.PI/6);           // 6s breath
  c.save();
  const g1=c.createRadialGradient(1560,470,80,1560,470,620);
  g1.addColorStop(0,`rgba(255,190,110,${0.045+0.05*puls})`);g1.addColorStop(1,'rgba(255,190,110,0)');
  c.fillStyle=g1;c.fillRect(940,0,980,1080);
  const hue=(i*2)%360;
  const g2=c.createRadialGradient(960,800,20,960,800,220);
  g2.addColorStop(0,`hsla(${hue},80%,60%,${0.06+0.04*puls})`);g2.addColorStop(1,'hsla(0,0%,0%,0)');
  c.fillStyle=g2;c.fillRect(740,580,440,440);
  c.restore();
}
</script></body></html>
