const X=document.getElementById('cv').getContext('2d');const W=1920,H=1080;const P=Math.round;let T=0;

let yOf=null;

// ---- view state: candle → line → candle → footprint ----
const tLine=sT(19.75), tCand=sT(21.35), tFp=sT(24.62);
function viewMix(){ // returns {candle,line,fp} alphas
  const l1=clamp((T-tLine)/0.4,0,1), c2=clamp((T-tCand)/0.4,0,1), f1=clamp((T-tFp)/0.5,0,1);
  const line=l1*(1-c2), fp=f1;
  const candle=(1-l1*(1-c2))*(1-fp);
  return {candle,line,fp};
}

// ---- deterministic footprint data from series tail ----
function fpData(i){ // column for candle index i
  const k=SER[i];const rows=[];const nr=5;
  const rng=IFE.mulberry32(IFE.hashSeed(4242,i));
  let tb=0,ta=0;
  for(let r=0;r<nr;r++){
    const b=P(20+rng()*140), a=P(20+rng()*150);
    const bi=b>130, ai=a>140;
    rows.push({bid:b,ask:a,bi,ai});tb+=b;ta+=a;
  }
  const d=ta-tb;
  return {rows,up:k.c>=k.o,delta:(d<0?'−':'')+Math.abs(d),total:(((ta+tb)/1000).toFixed(2)).replace('.',',')+'K',tot2:[String(tb),String(ta)]};
}

  for(let i=0;i<rows.length;i++){
    const ry=by+136+i*48;
    if(i===hoverRow){X.fillStyle='#f0f3fa';X.fillRect(bx+224,ry-16,bw-248,44);}

    X.fillStyle=i===hoverRow?C.tvBlue:C.tvInk;X.font=(i===1?'600':'400')+' 15px '+SANS;
    X.fillText(rows[i],bx+272,ry+6);
    X.fillStyle='#9598a1';X.font='400 12px '+SANS;X.textAlign='right';X.fillText(i%2?'TradingView':'',bx+bw-32,ry+6);X.textAlign='left';
  }
  X.restore();
}

// ---- chart-type dropdown ----
function typeMenu(a,hover){
  if(a<=0)return;
  const bx=560,by=TV.tool.y0+TV.tool.h+4,bw=250,rows=['Balken','Kerzen','Hohle Kerzen','Linie','Linie mit Markern','Stufenlinie','Fläche','HLC Fläche','Basislinie','Volumen-Fußabdruck','Renko','Heikin Ashi'];

  X.save();X.globalAlpha=clamp(a*1.5,0,1);

  X.fillStyle='#fff';rr(X,bx,by,bw,bh*TVC.eo(a),10);X.fill();X.shadowColor='transparent';
  X.save();rr(X,bx,by,bw,bh*TVC.eo(a),10);X.clip();

  for(let i=0;i<rows.length;i++){
    const ry=by+8+i*36;

    // mini icon
    X.strokeStyle=i===hover?C.tvBlue:'#5d616b';X.lineWidth=1.4;

    if(rows[i]==='Linie'){X.beginPath();X.moveTo(ix-8,iy+5);X.lineTo(ix-2,iy-4);X.lineTo(ix+3,iy+2);X.lineTo(ix+8,iy-6);X.stroke();}
    else if(rows[i]==='Volumen-Fußabdruck'){X.strokeRect(ix-8,iy-7,7,14);X.strokeRect(ix+1,iy-7,7,14);}
    else{X.strokeRect(ix-7,iy-5,4,10);X.strokeRect(ix+2,iy-7,4,12);}
    X.lineWidth=1;
    X.fillStyle=i===hover?C.tvBlue:C.tvInk;X.font='400 14px '+SANS;X.textAlign='left';
    X.fillText(rows[i],bx+48,ry+18);
  }
  X.restore();X.restore();
}

  TVC.dcDeltaFooter(X,{x0:cx0+50,x1:1740,y0:TASK.y0-TVC.DC.bottom.h-160,cols,rowH:44});

// ---- brand lower-thirds (bottom-center) ----
function ltPill(bx,by,bw,bh,edge){X.fillStyle=hexA('#070a10',0.86);rr(X,bx,by,bw,bh,14);X.fill();X.strokeStyle=hexA(edge,0.65);X.lineWidth=2;rr(X,bx,by,bw,bh,14);X.stroke();X.lineWidth=1;}
function lower(t0,t1,edge,label,sub){
  const a=es(clamp((T-t0)/0.5,0,1))*(1-clamp((T-t1)/0.4,0,1));if(a<=0)return;
  X.save();X.globalAlpha=a;
  X.font='800 20px '+SANS;const w=Math.max(X.measureText(label).width+70,sub?X.measureText(sub).width+70:0);
  const bw=Math.max(430,w),bh=sub?66:56,bx=(W-bw)/2,by=H-100;
  ltPill(bx,by,bw,bh,edge);
  X.fillStyle=edge;X.beginPath();X.arc(bx+30,by+bh/2,5,0,7);X.fill();
  X.fillStyle=INK;X.textAlign='left';X.textBaseline='middle';
  X.fillText(label,bx+52,by+(sub?24:bh/2));
  if(sub){X.fillStyle=MUT;X.font='600 13px '+SANS;X.fillText(sub,bx+52,by+47);}
  X.restore();
}

// ---- cursor scenario ----
const railY=i=>TV.tool.y0+TV.tool.h+1+30+i*44;
const ms=vo=>sT(vo)*1000;
const cur=IFE.Cursor([

  {at:900, move:[840,460], W:200},

  {at:ms(7.30), move:[TV.rail.w/2,railY(5)], W:32},
  {at:ms(8.99), move:[652,TV.tool.y0+TV.tool.h/2], W:120},   // ƒₓ Indikatoren
  {at:ms(9.95), click:true},
  {at:ms(12.20), move:[(W-760)/2+330,200+136+1*48], W:420},  // hover VP fester Bereich row
  {at:ms(15.60), move:[(W-760)/2+760-24,200+36], W:36},      // to ×
  {at:ms(15.90), click:true},
  {at:ms(16.96), move:[586,TV.tool.y0+TV.tool.h/2], W:60},   // chart-type icon

], {start:[700,400], seed:70211, os:'win', t0:0});

// menu envelopes
const indEnv=t=>Math.min(clamp((t-sT(10.15))/0.28,0,1),1-clamp((t-sT(16.05))/0.3,0,1));
const typeEnv=t=>{
  // three openings: 17.6→19.5 ; 20.55→21.45 ; 23.55→24.6 (vo)
  const e1=Math.min(clamp((t-sT(17.62))/0.24,0,1),1-clamp((t-sT(19.52))/0.22,0,1));
  const e2=Math.min(clamp((t-sT(20.57))/0.24,0,1),1-clamp((t-sT(21.42))/0.22,0,1));
  const e3=Math.min(clamp((t-sT(23.57))/0.24,0,1),1-clamp((t-sT(24.58))/0.22,0,1));
  return Math.max(e1,Math.max(e2,e3));
};
function typeHover(t){
  if(t<sT(19.0))return -1;
  if(t<sT(20.3))return 3;
  if(t<sT(22.6))return 1;
  return 9;
}
const dcEnv=t=>Math.min(clamp((t-sT(34.92))/0.35,0,1),1-clamp((t-sT(43.75))/0.35,0,1));

// scene alpha (fade in/out, no empty frames)
const sA=()=>Math.min(clamp(T/0.35,0,1),1-clamp((T-(DUR-0.35))/0.35,0,1));

function renderAt(msIn){
  T=msIn/1000;const s=cur.sample(msIn);
  // ---------- base: browser + TV chart page ----------
  TVC.browserChrome(X,{});
  TVC.tvToolbar(X,{symbol:'XAUUSD',interval:'1m',replay:false});
  X.fillStyle='#fff';X.fillRect(0,TV.tool.y0+TV.tool.h+1,W,TASK.y0-(TV.tool.y0+TV.tool.h+1));
  const reveal=clamp((T-0.15)/1.6,0,1)*N;
  yOf=TVC.priceScale(X,{y0:CH.y0,y1:CH.y1,pmin:PMIN,pmax:PMAX,step:2.5,dec:3,x0:CH.x0});
  TVC.tvWatermark(X,{sym:'XAUUSD',int:'1',name:'Gold Spot / U.S. Dollar',replay:false});
  const mix=viewMix();
  // candles / line / footprint
  if(mix.candle>0.01){
    X.save();X.globalAlpha=mix.candle;
    TVC.candles(X,{series:SER,x0:CH.x0+20,cw:CWc,yOf,reveal,style:'blue'});
    X.restore();
  }
  if(mix.line>0.01){
    X.save();X.globalAlpha=mix.line;
    X.strokeStyle=C.tvBlue;X.lineWidth=2;X.beginPath();
    for(let i=0;i<Math.min(N,reveal);i++){const x=CH.x0+20+i*CWc+CWc/2,y=yOf(SER[i].c);i?X.lineTo(x,y):X.moveTo(x,y);}
    X.stroke();X.lineWidth=1;
    // area fill
    X.globalAlpha=mix.line*0.10;X.lineTo(CH.x0+20+(Math.min(N,reveal)-1)*CWc+CWc/2,CH.y1);X.lineTo(CH.x0+20+CWc/2,CH.y1);X.closePath();X.fillStyle=C.tvBlue;X.fill();
    X.restore();
  }
  if(mix.fp>0.01){
    X.save();X.globalAlpha=mix.fp;
    // footprint view: last 8 candles as big columns, wipe L→R
    const nc=8, colW=(CH.x1-CH.x0-140)/nc;
    const wipe=clamp((T-tFp)/1.7,0,1)*nc;
    for(let cI=0;cI<Math.ceil(wipe);cI++){
      const d=fpData(N-nc+cI);
      const kk=SER[N-nc+cI];
      const yMid=yOf((kk.o+kk.c)/2);
      const colA=clamp(wipe-cI,0,1);
      X.save();X.globalAlpha=mix.fp*colA;
      TVC.footprintCol(X,{x:CH.x0+70+cI*colW+colW/2,y0:clamp(yMid-5*29/2,CH.y0+90,CH.y1-260),cw:56,rh:29,rows:d.rows,up:d.up,delta:d.delta,total:d.total,tot2:d.tot2});
      X.restore();
    }
    X.restore();
  }
  // legend + CVD + axis + bottom
  TVC.tvLegend(X,{name:'Gold Spot / U.S. Dollar',int:mix.fp>0.5?'1 · OANDA · Volumen-Fußabdruck':'1',src:mix.fp>0.5?'':'OANDA',
    o:'4.076,125',h:'4.078,030',l:'4.076,065',c:'4.077,615',chg:'+1,425 (+0,03%)',up:true,sell:'4.080,070',buy:'4.080,070'});
  TVC.cvdRow(X,{y:CH.y1+16,vals:[['−4,75K',1],['−4,02K',1],['−4,75K',1],['−4,02K',1]]});
  TVC.timeAxis(X,{y:CH.y1+30,labels:[[300,'20:30'],[560,'21:00'],[820,'21:30'],[1080,'22:00'],[1340,'22:30'],[1600,'22:40']]});
  TVC.tvBottomRow(X,{clockUTC:'20:47:25'});
  TVC.tvLeftRail(X,{hover:(T>=sT(4.2)&&T<sT(8.8))?[1,1,3,3,5,5][Math.min(5,Math.floor((T-sT(4.2))/((sT(8.8)-sT(4.2))/6)))] : -1});
  TVC.tvFloatBar(X,{});
  // rail tooltips on hover beats
  railTip(clamp((T-sT(5.0))/0.25,0,1)*(1-clamp((T-sT(6.4))/0.25,0,1)),'Trendlinie',railY(1));
  railTip(clamp((T-sT(6.6))/0.25,0,1)*(1-clamp((T-sT(7.9))/0.25,0,1)),'Fib Retracement',railY(3));
  railTip(clamp((T-sT(7.95))/0.25,0,1)*(1-clamp((T-sT(9.3))/0.25,0,1)),'Pinsel',railY(5));
  // menus
  indDialog(indEnv(T),T>=sT(12.9)?1:-1);
  typeMenu(typeEnv(T),typeHover(T));
  // crosshair lines when on chart
  const onChart=s.x>CH.x0&&s.x<CH.x1&&s.y>CH.y0&&s.y<CH.y1&&indEnv(T)<=0&&typeEnv(T)<=0&&dcEnv(T)<=0;
